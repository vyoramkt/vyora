<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src 'self' data: blob:; connect-src https://*.supabase.co; base-uri 'none'; form-action 'none'">
<title>Análise de crédito</title>
<style>
  :root{
    --tinta:#0d2430; --tinta-2:#3d5561; --tinta-3:#6f858f;
    --linha:#e3eaed; --linha-2:#f0f4f6; --fundo:#f6f9fa; --papel:#fff;
    --marca:#0e3e4a; --marca-viva:#13606f; --cresce:#0f9d6e; --alerta:#b45309; --erro:#b91c1c;
    --raio:16px; --sombra:0 1px 2px rgba(13,36,48,.05),0 8px 24px rgba(13,36,48,.06);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    font:15px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    color:var(--tinta); background:var(--fundo);
    -webkit-font-smoothing:antialiased; padding:0 0 60px;
  }
  .topo{background:var(--marca); color:#fff; padding:26px 20px 30px}
  .dentro{max-width:640px; margin:0 auto; padding:0 20px}
  .topo .dentro{padding:0 20px}
  .marca{display:flex; align-items:center; gap:12px; margin-bottom:20px}
  .sigla{
    width:42px; height:42px; border-radius:13px; background:rgba(255,255,255,.14);
    display:flex; align-items:center; justify-content:center; font-weight:700; font-size:15px; letter-spacing:.5px
  }
  .marca b{display:block; font-size:15.5px; letter-spacing:-.2px}
  .marca span{display:block; font-size:12.5px; opacity:.75}
  .topo h1{font-size:23px; line-height:1.25; letter-spacing:-.5px; font-weight:700; margin-bottom:8px}
  .topo p{font-size:14px; opacity:.82; max-width:34em}

  .cartao{
    background:var(--papel); border:1px solid var(--linha); border-radius:var(--raio);
    box-shadow:var(--sombra); margin-top:-14px; overflow:hidden
  }
  .cartao + .cartao{margin-top:16px}
  .cartao-c{padding:22px}
  .cartao-t{
    padding:16px 22px; border-bottom:1px solid var(--linha-2);
    font-weight:650; font-size:14.5px; letter-spacing:-.1px
  }
  h2{font-size:16px; letter-spacing:-.2px; margin:26px 0 12px; font-weight:650}
  h2:first-child{margin-top:0}
  .hint{font-size:12.5px; color:var(--tinta-3); margin-top:5px; line-height:1.5}

  .campo{margin-bottom:16px}
  .campo label{display:block; font-size:12.5px; font-weight:600; color:var(--tinta-2); margin-bottom:6px}
  .rq{color:var(--erro)}
  input,select,textarea{
    width:100%; font:inherit; color:inherit; background:var(--papel);
    border:1px solid var(--linha); border-radius:11px; padding:12px 13px; outline:0
  }
  input:focus,select:focus,textarea:focus{border-color:var(--marca-viva); box-shadow:0 0 0 3px rgba(19,96,111,.1)}
  textarea{min-height:74px; resize:vertical}
  .dupla{display:grid; grid-template-columns:1fr 1fr; gap:12px}
  @media(max-width:520px){.dupla{grid-template-columns:1fr}}

  .btn{
    font:inherit; font-weight:600; border:1px solid var(--linha); background:var(--papel);
    color:var(--tinta); border-radius:12px; padding:13px 20px; cursor:pointer; width:100%
  }
  .btn-p{background:var(--marca); border-color:var(--marca); color:#fff}
  .btn-p:disabled{opacity:.55; cursor:default}

  .aviso{
    border-radius:12px; padding:13px 15px; font-size:13.5px; line-height:1.55;
    background:var(--linha-2); border:1px solid var(--linha); margin-bottom:16px
  }
  .aviso.erro{background:#fef2f2; border-color:#fecaca; color:#7f1d1d}
  .aviso.ok{background:#ecfdf5; border-color:#a7f3d0; color:#065f46}
  .aviso.wr{background:#fffbeb; border-color:#fde68a; color:#78350f}

  /* etapas */
  .passos{list-style:none}
  .passo{display:flex; gap:14px; padding:14px 0; border-bottom:1px solid var(--linha-2)}
  .passo:last-child{border-bottom:0}
  .bola{
    width:26px; height:26px; border-radius:50%; flex:none; border:2px solid var(--linha);
    display:flex; align-items:center; justify-content:center; font-size:12px; font-weight:700; color:var(--tinta-3)
  }
  .passo.feito .bola{background:var(--cresce); border-color:var(--cresce); color:#fff}
  .passo.agora .bola{border-color:var(--marca-viva); color:var(--marca-viva)}
  .passo.negado .bola{background:var(--erro); border-color:var(--erro); color:#fff}
  .passo b{display:block; font-size:14px; font-weight:600}
  .passo span{display:block; font-size:12.5px; color:var(--tinta-3)}

  /* anexos */
  .anexo{
    border:1px dashed var(--linha); border-radius:12px; padding:14px; margin-bottom:12px;
    display:flex; align-items:center; gap:12px
  }
  .anexo.pronto{border-style:solid; border-color:#a7f3d0; background:#f0fdf9}
  .anexo b{display:block; font-size:13.5px}
  .anexo span{display:block; font-size:12px; color:var(--tinta-3)}
  .anexo input[type=file]{display:none}
  .anexo .escolher{
    font:inherit; font-size:13px; font-weight:600; border:1px solid var(--linha); background:var(--papel);
    border-radius:10px; padding:9px 14px; cursor:pointer; white-space:nowrap
  }
  .rodape{text-align:center; font-size:12px; color:var(--tinta-3); padding:26px 20px 0; line-height:1.6}
  .esconde{display:none}
</style>
</head>
<body>

<div class="topo">
  <div class="dentro">
    <div class="marca">
      <div class="sigla" id="sigla">—</div>
      <div><b id="empresa">Carregando…</b><span>Análise de crédito</span></div>
    </div>
    <h1 id="titulo">Um instante</h1>
    <p id="sub">Estamos abrindo o seu link.</p>
  </div>
</div>

<div class="dentro">
  <div id="tela"></div>
  <div class="rodape">
    Seus dados são usados apenas para esta análise de crédito e ficam com a empresa que enviou o link.<br>
    Plataforma <b>Vyora</b>
  </div>
</div>

<script>
"use strict";
/* =======================================================================
   ANÁLISE DE CRÉDITO · a página que o cliente abre

   Ela não tem login e não conhece nenhuma empresa. Tudo o que sabe é o
   código que veio no link. Com ele, pergunta ao servidor o que mostrar,
   envia o formulário uma única vez e acompanha as etapas.

   Nada é gravado neste navegador: se a pessoa fechar antes de enviar,
   ela recomeça — e é assim mesmo, porque são dados sensíveis num
   aparelho que pode não ser dela.
   ======================================================================= */
var SUPA_URL = "https://nxvyvrbgkxysycnaeova.supabase.co";
var SUPA_KEY = "sb_publishable_d1acZQt5kyHr_bwfIfiRcA_jXGZWfUq";

var CODIGO = (function () {
  var m = String(location.search || "").match(/[?&]e=([A-Za-z0-9_-]{4,})/);
  return m ? m[1] : "";
})();
/* o rascunho existe só enquanto a pessoa preenche: é ele que amarra os
   documentos enviados antes de o formulário ir embora */
var RASCUNHO = (function () {
  var s = "", letras = "abcdefghijklmnopqrstuvwxyz0123456789";
  for (var i = 0; i < 20; i++) s += letras[Math.floor(Math.random() * letras.length)];
  return s;
})();
var ANEXOS = {};
var LOJA = null;

function el(id) { return document.getElementById(id); }
function esc(s) {
  return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
    return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
  });
}
function v(id) { var e = el(id); return e ? String(e.value || "").trim() : ""; }
function dig(s) { return String(s || "").replace(/\D/g, ""); }
function iniciais(nome) {
  var p = String(nome || "").trim().split(/\s+/);
  return ((p[0] || "")[0] || "") + ((p[1] || "")[0] || "");
}
function pedir(caminho, corpo) {
  return fetch(SUPA_URL + caminho, {
    method: "POST",
    headers: { apikey: SUPA_KEY, Authorization: "Bearer " + SUPA_KEY, "Content-Type": "application/json" },
    body: JSON.stringify(corpo || {})
  }).then(function (r) { return r.json().then(function (j) { return { ok: r.ok, j: j }; }); });
}

/* ---------------- abrir o link da loja ---------------- */
function abrir() {
  if (!CODIGO) return semLink();
  pedir("/rest/v1/rpc/formulario_abrir", { codigo: CODIGO })
    .then(function (x) {
      if (!x.ok || !x.j || !x.j.empresa) return semLink();
      LOJA = x.j;
      el("empresa").textContent = LOJA.empresa;
      el("sigla").textContent = (LOJA.sigla || iniciais(LOJA.empresa) || "VY").toUpperCase();
      document.title = "Análise de crédito · " + LOJA.empresa;
      pintarFormulario();
    })
    .catch(semLink);
}
function semLink() {
  var vazio = !CODIGO;
  el("empresa").textContent = "Análise de crédito";
  el("sigla").textContent = "VY";
  el("titulo").textContent = vazio ? "Esta página abre pelo link da loja" : "Link da loja não reconhecido";
  el("sub").textContent = vazio
    ? "Sozinha, ela não tem o que mostrar."
    : "Este endereço não corresponde a nenhuma loja ativa.";
  el("tela").innerHTML =
    '<div class="cartao"><div class="cartao-c">' +
    (vazio
      ? '<div class="aviso">Cada loja tem o próprio endereço de análise, terminado em ' +
        "<b>?e=</b> e um código. É por ele que sabemos de quem é a ficha.<br><br>" +
        "<b>Se você é cliente:</b> procure a mensagem que a loja te mandou e abra por ela.<br><br>" +
        "<b>Se você é da loja:</b> o endereço é gerado uma única vez no sistema, em " +
        "<b>Análise de crédito › Gerar o link da loja</b>. Depois disso é sempre o mesmo.</div>"
      : '<div class="aviso erro">Confira se o link veio completo — às vezes ele quebra ao ser copiado. ' +
        "Peça de novo para a loja: é sempre o mesmo endereço.</div>") +
    "</div></div>";
}

/* ---------------- o formulário ---------------- */
function pintarFormulario() {
  el("titulo").textContent = "Vamos analisar o seu crédito";
  el("sub").textContent = "Leva uns 5 minutos. Depois de enviar, um vendedor entra em contato para " +
    "agendar a visita — em até 72 horas.";

  el("tela").innerHTML =
    '<div class="cartao"><div class="cartao-c">' +

    '<div style="margin-bottom:16px"><button class="btn" onclick="pintarAcompanhar()">Já enviei — quero acompanhar</button></div>' +
    '<div class="aviso">Preencha com calma e confira antes de enviar: <b>o formulário só pode ser enviado uma vez</b>. ' +
    "<b>Todas as informações são obrigatórias</b>, menos o último campo. Se faltar alguma, a análise trava e a visita atrasa.</div>" +

    '<h2>Quem é você</h2>' +
    '<div class="campo"><label>Nome completo <span class="rq">*</span></label><input id="f-nome" autocomplete="name"></div>' +
    '<div class="dupla">' +
      '<div class="campo"><label>CPF <span class="rq">*</span></label><input id="f-cpf" inputmode="numeric" maxlength="14" placeholder="000.000.000-00" oninput="mascaraCpf(this)"></div>' +
      '<div class="campo"><label>Data de nascimento <span class="rq">*</span></label><input id="f-nasc" type="date"></div>' +
    "</div>" +
    '<div class="dupla">' +
      '<div class="campo"><label>Telefone 1 <span class="rq">*</span></label><input id="f-fone1" inputmode="tel" placeholder="(00) 00000-0000" oninput="mascaraFone(this)"></div>' +
      '<div class="campo"><label>Telefone 2 <span class="rq">*</span></label><input id="f-fone2" inputmode="tel" placeholder="(00) 00000-0000" oninput="mascaraFone(this)"><div class="hint">Precisa ser diferente do primeiro — é o segundo caminho para te achar.</div></div>' +
    "</div>" +

    "<h2>Onde você mora</h2>" +
    '<div class="campo"><label>Endereço <span class="rq">*</span></label><input id="f-end" placeholder="Rua, número"></div>' +
    '<div class="dupla">' +
      '<div class="campo"><label>Bairro <span class="rq">*</span></label><input id="f-bairro"></div>' +
      '<div class="campo"><label>Cidade <span class="rq">*</span></label><input id="f-cidade"></div>' +
    "</div>" +
    '<div class="dupla">' +
      '<div class="campo"><label>Ponto de referência 1 <span class="rq">*</span></label><input id="f-ref1" placeholder="Perto de..."></div>' +
      '<div class="campo"><label>Ponto de referência 2 <span class="rq">*</span></label><input id="f-ref2"></div>' +
    "</div>" +
    '<div class="campo"><label>A casa é própria? <span class="rq">*</span></label>' +
      '<select id="f-moradia"><option value="">Escolha</option>' +
      '<option value="propria">Própria</option><option value="alugada">Alugada</option>' +
      '<option value="familiar">De familiar</option><option value="cedida">Cedida</option></select></div>' +
    '<div class="campo"><label>Há quanto tempo mora aí? <span class="rq">*</span></label>' +
      '<select id="f-tempo-casa"><option value="">Escolha</option>' +
      '<option value="menos de 1 ano">Menos de 1 ano</option><option value="1 a 3 anos">1 a 3 anos</option>' +
      '<option value="3 a 10 anos">3 a 10 anos</option><option value="mais de 10 anos">Mais de 10 anos</option></select></div>' +

    "<h2>Trabalho e renda</h2>" +
    '<div class="dupla">' +
      '<div class="campo"><label>Em que você trabalha <span class="rq">*</span></label><input id="f-funcao" placeholder="Sua função"></div>' +
      '<div class="campo"><label>Nome da empresa <span class="rq">*</span></label><input id="f-empresa"></div>' +
    "</div>" +
    '<div class="dupla">' +
      '<div class="campo"><label>Endereço do trabalho <span class="rq">*</span></label><input id="f-end-trab"></div>' +
      '<div class="campo"><label>Bairro do trabalho <span class="rq">*</span></label><input id="f-bairro-trab"></div>' +
    "</div>" +
    '<div class="campo"><label>Ponto de referência do trabalho <span class="rq">*</span></label><input id="f-ref-trab"></div>' +
    '<div class="dupla">' +
      '<div class="campo"><label>Renda mensal (R$) <span class="rq">*</span></label><input id="f-renda" inputmode="decimal" placeholder="0,00"></div>' +
      '<div class="campo"><label>Quantas pessoas trabalham em casa <span class="rq">*</span></label>' +
        '<select id="f-quantos"><option value="">Escolha</option><option>1</option><option>2</option><option>3</option><option>4 ou mais</option></select></div>' +
    "</div>" +
    '<div class="campo"><label>Renda da casa somada (R$) <span class="rq">*</span></label><input id="f-renda-casa" inputmode="decimal" placeholder="0,00">' +
      '<div class="hint">Some tudo que entra por mês na casa, contando outras pessoas.</div></div>' +

    "<h2>Referências</h2>" +
    '<div class="aviso">Precisamos de <b>três contatos de pessoas próximas</b> e do endereço de um parente. ' +
    "Isso é o que mais pesa na análise.</div>" +
    '<div class="campo"><label>Endereço de um parente <span class="rq">*</span></label><input id="f-end-parente" placeholder="Rua, número, bairro, cidade"></div>' +
    '<div class="dupla">' +
      '<div class="campo"><label>Contato 1 — nome e parentesco <span class="rq">*</span></label><input id="f-ref-n1" placeholder="Ex.: Maria, irmã"></div>' +
      '<div class="campo"><label>Telefone do contato 1 <span class="rq">*</span></label><input id="f-ref-t1" inputmode="tel" oninput="mascaraFone(this)"></div>' +
    "</div>" +
    '<div class="dupla">' +
      '<div class="campo"><label>Contato 2 — nome e parentesco <span class="rq">*</span></label><input id="f-ref-n2"></div>' +
      '<div class="campo"><label>Telefone do contato 2 <span class="rq">*</span></label><input id="f-ref-t2" inputmode="tel" oninput="mascaraFone(this)"></div>' +
    "</div>" +
    '<div class="dupla">' +
      '<div class="campo"><label>Contato 3 — nome e parentesco <span class="rq">*</span></label><input id="f-ref-n3"></div>' +
      '<div class="campo"><label>Telefone do contato 3 <span class="rq">*</span></label><input id="f-ref-t3" inputmode="tel" oninput="mascaraFone(this)"></div>' +
    "</div>" +

    "<h2>O que você quer levar</h2>" +
    '<div class="campo"><label>Produto desejado <span class="rq">*</span></label><input id="f-pedido" placeholder="Ex.: televisão"></div>' +
    '<div class="dupla">' +
      '<div class="campo"><label>Em quantas vezes <span class="rq">*</span></label>' +
        '<select id="f-vezes" onchange="somarPedido()"><option value="">Escolha</option>' +
        [3, 4, 5, 6, 8, 10, 12, 15, 18, 20, 24].map(function (n) { return "<option>" + n + "x</option>"; }).join("") +
        "</select></div>" +
      '<div class="campo"><label>Valor de cada parcela (R$) <span class="rq">*</span></label>' +
        '<input id="f-parcela" inputmode="decimal" placeholder="0,00" oninput="somarPedido()"></div>' +
    "</div>" +
    '<div class="campo" id="f-total-caixa" style="display:none"><div class="aviso" id="f-total"></div></div>' +
    '<div class="campo"><label>Melhor dia para pagar <span class="rq">*</span></label>' +
      '<select id="f-dia"><option value="">Escolha</option>' +
      [5, 10, 15, 20, 25, 30].map(function (d) { return "<option>" + d + "</option>"; }).join("") + "</select>" +
      '<div class="hint">O vendedor confirma tudo isso na visita — aqui é só para ele já chegar sabendo.</div></div>' +
    '<div class="campo"><label>Quer contar mais alguma coisa? <span class="hint" style="display:inline">— único campo opcional</span></label><textarea id="f-obs" placeholder="Opcional"></textarea></div>' +

    "<h2>Documentos</h2>" +
    '<div class="aviso">Pode ser foto pelo celular. O comprovante de renda pode ser o <b>print do aplicativo do banco</b> ' +
    "mostrando o último pagamento.</div>" +
    caixaAnexo("renda", "Comprovante de renda", "contracheque, print do banco ou recibo") +
    caixaAnexo("residencia", "Comprovante de residência", "conta de luz, água ou telefone") +
    caixaAnexo("foto", "Uma foto sua, de agora", "para confirmarmos que é você mesmo") +
    caixaAnexo("documento", "Documento com foto", "RG ou CNH — frente e verso na mesma imagem") +

    '<div id="f-erro" class="aviso erro esconde" style="margin-top:18px"></div>' +
    '<div style="margin-top:20px"><button class="btn btn-p" id="f-btn" onclick="enviar()">Enviar para análise</button></div>' +
    '<div class="hint" style="text-align:center;margin-top:12px">Ao enviar, você autoriza a empresa a usar estes dados ' +
    "para analisar o seu crédito e entrar em contato.</div>" +

    "</div></div>";
}
function caixaAnexo(tipo, titulo, ajuda) {
  return '<div class="anexo" id="ax-' + tipo + '">' +
    "<div style='flex:1'><b>" + esc(titulo) + "</b><span id='ax-" + tipo + "-s'>" + esc(ajuda) + "</span></div>" +
    "<label class='escolher'>Escolher" +
    "<input type='file' accept='image/*,application/pdf' onchange=\"subirAnexo('" + tipo + "',this)\">" +
    "</label></div>";
}

/* ---------------- máscaras, para não errar digitando ---------------- */
function mascaraCpf(i) {
  var d = dig(i.value).slice(0, 11);
  i.value = d.replace(/(\d{3})(\d)/, "$1.$2").replace(/(\d{3})\.(\d{3})(\d)/, "$1.$2.$3")
    .replace(/\.(\d{3})(\d{1,2})$/, ".$1-$2");
}
function mascaraFone(i) {
  var d = dig(i.value).slice(0, 11);
  if (d.length <= 10) i.value = d.replace(/(\d{2})(\d)/, "($1) $2").replace(/(\d{4})(\d)/, "$1-$2");
  else i.value = d.replace(/(\d{2})(\d)/, "($1) $2").replace(/(\d{5})(\d)/, "$1-$2");
}
function cpfValido(c) {
  c = dig(c);
  if (c.length !== 11 || /^(\d)\1{10}$/.test(c)) return false;
  var s = 0, i;
  for (i = 0; i < 9; i++) s += +c[i] * (10 - i);
  var d1 = (s * 10) % 11 % 10;
  if (d1 !== +c[9]) return false;
  s = 0;
  for (i = 0; i < 10; i++) s += +c[i] * (11 - i);
  return ((s * 10) % 11 % 10) === +c[10];
}
/* telefone brasileiro de verdade: DDD que existe, tamanho certo, e
   celular tem que começar com 9. Número repetido é dedo batendo na tecla. */
var DDDS = [11,12,13,14,15,16,17,18,19,21,22,24,27,28,31,32,33,34,35,37,38,
            41,42,43,44,45,46,47,48,49,51,53,54,55,61,62,63,64,65,66,67,68,69,
            71,73,74,75,77,79,81,82,83,84,85,86,87,88,89,91,92,93,94,95,96,97,98,99];
function foneValido(t) {
  var d = dig(t);
  if (d.length !== 10 && d.length !== 11) return false;
  if (/^(\d)\1+$/.test(d)) return false;
  if (DDDS.indexOf(parseInt(d.slice(0, 2), 10)) < 0) return false;
  if (d.length === 11 && d[2] !== "9") return false;
  if (d.length === 10 && "2345".indexOf(d[2]) < 0) return false;
  return true;
}
function idadeDe(nasc) {
  var p = String(nasc || "").split("-");
  if (p.length !== 3) return -1;
  var n = new Date(+p[0], +p[1] - 1, +p[2]);
  if (isNaN(n.getTime())) return -1;
  var hoje = new Date(), a = hoje.getFullYear() - n.getFullYear();
  var m = hoje.getMonth() - n.getMonth();
  if (m < 0 || (m === 0 && hoje.getDate() < n.getDate())) a--;
  return a;
}
function comoNumero(t) {
  t = String(t || "").replace(/[^\d,.-]/g, "").replace(/\./g, "").replace(",", ".");
  var n = parseFloat(t);
  return isNaN(n) ? 0 : n;
}

/* mostra a conta pronta, para a pessoa ver no que está se metendo */
function somarPedido() {
  var vezes = parseInt(String(v("f-vezes")).replace(/\D/g, ""), 10) || 0;
  var parcela = comoNumero(v("f-parcela"));
  var caixa = el("f-total-caixa"), texto = el("f-total");
  if (!caixa) return;
  if (!vezes || !parcela) { caixa.style.display = "none"; return; }
  texto.innerHTML = "<b>" + vezes + "x de " + dinheiro(parcela) + "</b> — total de <b>" + dinheiro(vezes * parcela) + "</b>.";
  caixa.style.display = "block";
}
function dinheiro(n) {
  return "R$ " + Number(n || 0).toLocaleString("pt-BR", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
}

/* ---------------- anexos ---------------- */
function subirAnexo(tipo, campo) {
  var arq = campo.files && campo.files[0];
  if (!arq) return;
  var caixa = el("ax-" + tipo), texto = el("ax-" + tipo + "-s");
  if (arq.size > 8 * 1024 * 1024) {
    texto.textContent = "Arquivo muito grande (máximo 8 MB). Tente outra foto.";
    return;
  }
  texto.textContent = "Enviando…";
  var pedaco = String(arq.name || "").split(".");
  var extensao = pedaco.length > 1 ? pedaco[pedaco.length - 1] : "jpg";

  fetch(SUPA_URL + "/functions/v1/redefinir-senha", {
    method: "POST",
    headers: { apikey: SUPA_KEY, Authorization: "Bearer " + SUPA_KEY, "Content-Type": "application/json" },
    body: JSON.stringify({ acao: "anexo", codigo: CODIGO, rascunho: RASCUNHO, tipo: tipo, extensao: extensao })
  }).then(function (r) { return r.json(); })
    .then(function (j) {
      if (!j || !j.ok) throw new Error(j && j.erro || "falhou");
      return fetch(j.url, { method: "PUT", body: arq }).then(function (r) {
        if (!r.ok) throw new Error("upload");
        return j.caminho;
      });
    })
    .then(function (caminho) {
      /* o caminho vai junto com o formulário; nada é gravado antes disso */
      ANEXOS[tipo] = caminho;
      caixa.className = "anexo pronto";
      texto.textContent = "Recebido. Se quiser, pode enviar outro no lugar.";
    })
    .catch(function () {
      texto.textContent = "Não conseguimos enviar agora. Tente de novo em instantes.";
    });
}

/* ---------------- enviar ---------------- */
function enviar() {
  var err = el("f-erro"), btn = el("f-btn");
  function ruim(m, foco) {
    err.innerHTML = m; err.className = "aviso erro";
    btn.disabled = false; btn.textContent = "Enviar para análise";
    if (foco && el(foco)) { el(foco).focus(); el(foco).scrollIntoView({ block: "center" }); }
    return false;
  }
  err.className = "aviso erro esconde";

  /* IDENTIDADE */
  if (v("f-nome").split(/\s+/).length < 2) return ruim("Escreva o seu nome completo, como está no documento.", "f-nome");
  if (!cpfValido(v("f-cpf"))) return ruim("Confira o CPF — os números não fecham.", "f-cpf");
  if (!v("f-nasc")) return ruim("Informe a sua data de nascimento.", "f-nasc");
  var idade = idadeDe(v("f-nasc"));
  if (idade < 18) return ruim("É preciso ter 18 anos ou mais para comprar no crediário.", "f-nasc");
  if (idade > 110) return ruim("Confira a data de nascimento.", "f-nasc");
  if (!foneValido(v("f-fone1"))) return ruim("O telefone 1 não parece válido. Confira o DDD e os números.", "f-fone1");
  if (!foneValido(v("f-fone2"))) return ruim("O telefone 2 é obrigatório e precisa ser um número válido.", "f-fone2");
  if (dig(v("f-fone1")) === dig(v("f-fone2"))) return ruim("Os dois telefones são iguais. Informe outro contato seu.", "f-fone2");

  /* ONDE MORA */
  if (v("f-end").length < 5) return ruim("Informe o endereço completo, com número.", "f-end");
  if (!v("f-bairro")) return ruim("Informe o bairro.", "f-bairro");
  if (!v("f-cidade")) return ruim("Informe a cidade.", "f-cidade");
  if (v("f-ref1").length < 4) return ruim("O ponto de referência 1 é obrigatório — é como o vendedor te acha.", "f-ref1");
  if (v("f-ref2").length < 4) return ruim("O ponto de referência 2 também é obrigatório.", "f-ref2");
  if (!v("f-moradia")) return ruim("Diga se a casa é própria, alugada ou de familiar.", "f-moradia");
  if (!v("f-tempo-casa")) return ruim("Diga há quanto tempo você mora nesse endereço.", "f-tempo-casa");

  /* TRABALHO E RENDA */
  if (!v("f-funcao")) return ruim("Informe em que você trabalha.", "f-funcao");
  if (!v("f-empresa")) return ruim("Informe o nome da empresa onde trabalha.", "f-empresa");
  if (v("f-end-trab").length < 5) return ruim("Informe o endereço do trabalho.", "f-end-trab");
  if (!v("f-bairro-trab")) return ruim("Informe o bairro do trabalho.", "f-bairro-trab");
  if (v("f-ref-trab").length < 4) return ruim("Informe um ponto de referência do trabalho.", "f-ref-trab");
  var renda = comoNumero(v("f-renda"));
  if (renda <= 0) return ruim("Informe a sua renda mensal.", "f-renda");
  if (renda < 100) return ruim("Confira a renda — o valor parece incompleto.", "f-renda");
  if (!v("f-quantos")) return ruim("Diga quantas pessoas trabalham na casa.", "f-quantos");
  var rendaCasa = comoNumero(v("f-renda-casa"));
  if (rendaCasa <= 0) return ruim("Informe a renda somada da casa.", "f-renda-casa");
  if (rendaCasa < renda) return ruim("A renda da casa não pode ser menor que a sua. Some tudo que entra por mês.", "f-renda-casa");

  /* REFERÊNCIAS */
  if (v("f-end-parente").length < 8) return ruim("O endereço de um parente é obrigatório — com rua, número e bairro.", "f-end-parente");
  var contatos = [], vistos = [dig(v("f-fone1")), dig(v("f-fone2"))];
  for (var i = 1; i <= 3; i++) {
    var n = v("f-ref-n" + i), t = v("f-ref-t" + i), d = dig(t);
    if (n.length < 3) return ruim("Informe o nome e o parentesco do contato " + i + ".", "f-ref-n" + i);
    if (!foneValido(t)) return ruim("O telefone do contato " + i + " não parece válido.", "f-ref-t" + i);
    if (vistos.indexOf(d) >= 0) return ruim("O telefone do contato " + i + " já foi usado. Precisam ser três pessoas diferentes.", "f-ref-t" + i);
    vistos.push(d);
    contatos.push({ nome: n, telefone: d });
  }

  /* O PEDIDO */
  if (!v("f-pedido")) return ruim("Diga o que você quer levar.", "f-pedido");
  if (!v("f-vezes")) return ruim("Diga em quantas vezes você quer pagar.", "f-vezes");
  var parcela = comoNumero(v("f-parcela"));
  if (parcela <= 0) return ruim("Informe o valor de cada parcela.", "f-parcela");
  if (!v("f-dia")) return ruim("Escolha o melhor dia para pagar.", "f-dia");

  /* DOCUMENTOS */
  if (!ANEXOS.renda) return ruim("Falta o <b>comprovante de renda</b>. Pode ser o print do aplicativo do banco.");
  if (!ANEXOS.residencia) return ruim("Falta o <b>comprovante de residência</b>.");
  if (!ANEXOS.foto) return ruim("Falta a <b>sua foto de agora</b>.");
  if (!ANEXOS.documento) return ruim("Falta o <b>documento com foto</b> — RG ou CNH.");

  btn.disabled = true; btn.textContent = "Enviando…";

  var formulario = {
    nome: v("f-nome"), cpf: dig(v("f-cpf")), nascimento: v("f-nasc"),
    telefone1: dig(v("f-fone1")), telefone2: dig(v("f-fone2")),
    endereco: v("f-end"), bairro: v("f-bairro"), cidade: v("f-cidade"),
    referencia1: v("f-ref1"), referencia2: v("f-ref2"),
    moradia: v("f-moradia"), tempo_casa: v("f-tempo-casa"),
    funcao: v("f-funcao"), empresa: v("f-empresa"),
    endereco_trabalho: v("f-end-trab"), bairro_trabalho: v("f-bairro-trab"),
    referencia_trabalho: v("f-ref-trab"),
    renda: comoNumero(v("f-renda")), pessoas_trabalhando: v("f-quantos"),
    renda_casa: comoNumero(v("f-renda-casa")),
    endereco_parente: v("f-end-parente"), contatos: contatos,
    pedido: v("f-pedido"),
    parcelas: parseInt(String(v("f-vezes")).replace(/\D/g, ""), 10) || 0,
    parcela_desejada: comoNumero(v("f-parcela")),
    valor_total: (parseInt(String(v("f-vezes")).replace(/\D/g, ""), 10) || 0) * comoNumero(v("f-parcela")),
    dia_pagamento: v("f-dia"), observacao: v("f-obs")
  };

  formulario.anexos = ANEXOS;

  pedir("/rest/v1/rpc/formulario_enviar", { codigo: CODIGO, formulario: formulario })
    .then(function (x) {
      if (!x.ok || !x.j || x.j.erro) return ruim(esc((x.j && x.j.erro) || "Não conseguimos enviar agora. Tente de novo."));
      window.scrollTo(0, 0);
      pintarRecebido(formulario.nome, x.j.visita_ate, x.j.repetido);
    })
    .catch(function () { ruim("Sem resposta agora. Confira a sua internet e tente de novo."); });
}

/* ---------------- acompanhamento ---------------- */
var TEXTO_STATUS = {
  aguardando_visita: ["Recebemos o seu formulário", "Um vendedor vai te procurar para marcar a visita."],
  visita_agendada: ["Visita marcada", "O vendedor confirmou a data com você."],
  aprovado: ["Crédito aprovado", "Falta o frete para marcarmos a entrega."],
  frete_pago: ["Frete confirmado", "Agora é combinar a data da entrega."],
  entrega_agendada: ["Entrega marcada", "Alguém precisa estar em casa para receber."],
  entregue: ["Entregue", "Bom proveito. Qualquer coisa, é só chamar a loja."],
  reprovado: ["Não foi dessa vez", "A loja entrará em contato para explicar."],
  cancelado: ["Análise encerrada", "Esta análise foi encerrada pela loja."]
};
function pintarRecebido(nome, visitaAte, repetido) {
  el("titulo").textContent = repetido ? "Você já tem uma análise em andamento" : "Recebemos o seu formulário";
  el("sub").textContent = repetido
    ? "Não precisa mandar de novo — a sua já está na fila."
    : "Agora é com a gente. Um vendedor vai te procurar.";
  el("tela").innerHTML =
    '<div class="cartao"><div class="cartao-c">' +
    '<div class="aviso ok"><b>' + esc(String(nome || "").split(" ")[0]) + ", tudo certo.</b> " +
    "Seus dados e documentos chegaram" + (repetido ? " — e já tínhamos os anteriores." : ".") + "</div>" +
    passos(repetido ? "aguardando_visita" : "aguardando_visita", visitaAte) +
    '<div class="aviso wr" style="margin-top:16px"><b>Fique com o telefone por perto.</b> ' +
    "A visita acontece em até 72 horas e o vendedor liga antes. É uma conversa rápida, no seu endereço.</div>" +
    '<div class="hint" style="margin-top:14px">Para saber como está depois, volte neste mesmo link e ' +
    'toque em <b>"Já enviei — quero acompanhar"</b>.</div>' +
    "</div></div>" + botaoLoja();
}
function passos(st, visitaAte, extra) {
  var linha = [
    { nome: "Formulário enviado", ajuda: "recebemos os seus dados e documentos" },
    { nome: "Visita do vendedor", ajuda: visitaAte ? "até " + dataBonita(visitaAte) : "em até 72 horas" },
    { nome: "Resultado da análise", ajuda: "aprovado ou não, você fica sabendo" }
  ];
  /* aprovado abre um caminho novo: frete e entrega */
  if (["aprovado", "frete_pago", "entrega_agendada", "entregue"].indexOf(st) >= 0) {
    linha.push({ nome: "Frete", ajuda: extra && extra.frete ? "de " + extra.frete : "pago antes da entrega" });
    linha.push({ nome: "Entrega", ajuda: extra && extra.entrega ? extra.entrega : "combinada com você" });
  }
  var ordem = ["aguardando_visita", "visita_agendada", "aprovado", "frete_pago", "entrega_agendada", "entregue"];
  var onde = st === "reprovado" ? 3
    : st === "entregue" ? 5
    : st === "entrega_agendada" ? 5
    : st === "frete_pago" ? 4
    : st === "aprovado" ? 4
    : st === "visita_agendada" ? 2 : 1;
  if (st === "aprovado") onde = 4;
  if (st === "frete_pago") onde = 5;
  if (st === "entrega_agendada") onde = 5;
  if (st === "entregue") onde = 6;
  var negado = st === "reprovado";
  return '<ul class="passos" style="margin-top:16px">' + linha.map(function (p, i) {
    var n = i + 1, classe = "";
    if (n < onde) classe = "feito";
    else if (n === onde) classe = negado && n === 3 ? "negado" : (n === 3 && st === "aprovado" ? "feito" : "agora");
    var marca = classe === "feito" ? "✓" : classe === "negado" ? "!" : n;
    return '<li class="passo ' + classe + '"><span class="bola">' + marca + "</span>" +
      "<div><b>" + esc(p.nome) + "</b><span>" + esc(p.ajuda) + "</span></div></li>";
  }).join("") + "</ul>";
}
function botaoLoja() {
  if (!LOJA || !LOJA.whatsapp) return "";
  return '<div style="margin-top:16px"><a class="btn" style="display:block;text-align:center;text-decoration:none" ' +
    'href="https://wa.me/55' + esc(dig(LOJA.whatsapp)) + '" target="_blank" rel="noopener">Falar com a loja</a></div>';
}

/* quem já enviou volta aqui e confere pelo CPF e pela data de nascimento */
function pintarAcompanhar() {
  el("titulo").textContent = "Acompanhar a minha análise";
  el("sub").textContent = "Informe o CPF e a data de nascimento que você usou no formulário.";
  el("tela").innerHTML =
    '<div class="cartao"><div class="cartao-c">' +
    '<div class="campo"><label>CPF</label><input id="ac-cpf" inputmode="numeric" maxlength="14" placeholder="000.000.000-00" oninput="mascaraCpf(this)"></div>' +
    '<div class="campo"><label>Data de nascimento</label><input id="ac-nasc" type="date"></div>' +
    '<div id="ac-err" class="aviso erro esconde"></div>' +
    '<button class="btn btn-p" id="ac-btn" onclick="consultarStatus()">Ver o andamento</button>' +
    '<div style="margin-top:12px"><button class="btn" onclick="pintarFormulario()">Ainda não enviei — preencher agora</button></div>' +
    "</div></div>";
}
function consultarStatus() {
  var err = el("ac-err"), btn = el("ac-btn");
  function ruim(m) { err.innerHTML = m; err.className = "aviso erro"; btn.disabled = false; btn.textContent = "Ver o andamento"; }
  err.className = "aviso erro esconde";
  if (!cpfValido(v("ac-cpf"))) return ruim("Confira o CPF.");
  if (!v("ac-nasc")) return ruim("Informe a data de nascimento.");
  btn.disabled = true; btn.textContent = "Consultando…";
  pedir("/rest/v1/rpc/formulario_status", { codigo: CODIGO, cpf: dig(v("ac-cpf")), nascimento: v("ac-nasc") })
    .then(function (x) {
      if (!x.ok || !x.j || x.j.erro) return ruim(esc((x.j && x.j.erro) || "Não conseguimos consultar agora."));
      pintarAndamento(x.j);
    })
    .catch(function () { ruim("Sem resposta agora. Confira a sua internet."); });
}
function pintarAndamento(a) {
  var t = TEXTO_STATUS[a.status] || TEXTO_STATUS.aguardando_visita;
  el("titulo").textContent = t[0];
  el("sub").textContent = t[1];
  var h = '<div class="cartao"><div class="cartao-t">' + esc(a.nome || "Sua análise") + "</div><div class=\"cartao-c\">" +
    passos(a.status, a.visita, { frete: a.frete, entrega: a.entrega }) + "</div></div>";
  if (a.status === "aprovado") {
    h += '<div class="cartao"><div class="cartao-c"><div class="aviso ok">' +
      "<b>Seu crédito foi aprovado.</b> Falta o frete" + (a.frete ? " de <b>" + esc(a.frete) + "</b>" : "") +
      " para marcarmos a entrega." + (a.pagamento ? "<br><br>Pague por aqui: <b>" + esc(a.pagamento) + "</b>" : "") +
      "</div><div class='hint'>Assim que o pagamento cair, a loja marca a data com você.</div></div></div>";
  }
  if (a.status === "frete_pago") {
    h += '<div class="cartao"><div class="cartao-c"><div class="aviso ok">' +
      "<b>Frete confirmado.</b> A loja vai combinar a data da entrega com você.</div></div></div>";
  }
  if (a.status === "entrega_agendada") {
    h += '<div class="cartao"><div class="cartao-c"><div class="aviso wr">' +
      "<b>Entrega marcada" + (a.entrega ? " para " + esc(a.entrega) : "") + ".</b> " +
      "Precisa ter alguém em casa para receber.</div></div></div>";
  }
  if (a.status === "entregue") {
    h += '<div class="cartao"><div class="cartao-c"><div class="aviso ok">' +
      "<b>Entregue.</b> Obrigado pela preferência — e boas compras.</div></div></div>";
  }
  if (a.status === "aguardando_visita" || a.status === "visita_agendada") {
    h += '<div class="cartao"><div class="cartao-c"><div class="aviso wr">' +
      "<b>Fique com o telefone por perto.</b> A visita acontece em até 72 horas e o vendedor liga antes.</div>" +
      '<div class="hint">Precisa remarcar ou tem alguma dúvida? Fale com a loja.</div></div></div>';
  }
  if (a.status === "aprovado") {
    h += '<div class="cartao"><div class="cartao-c"><div class="aviso ok">' +
      "<b>Está aprovado.</b> Procure a loja para escolher o produto e combinar a entrega.</div></div></div>";
  }
  if (a.status === "reprovado") {
    h += '<div class="cartao"><div class="cartao-c"><div class="aviso">' +
      "Não conseguimos aprovar o crédito desta vez" + (a.motivo ? ": <b>" + esc(a.motivo) + "</b>" : ".") +
      "<br><br>Isso não é definitivo. Se a sua situação mudar, procure a loja de novo.</div></div></div>";
  }
  el("tela").innerHTML = h + botaoLoja();
}
function dataBonita(d) {
  var p = String(d || "").split("-");
  return p.length === 3 ? p[2] + "/" + p[1] + "/" + p[0] : d;
}
