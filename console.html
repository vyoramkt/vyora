<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vyora Console</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 64 64%22%3E%3Crect width=%2264%22 height=%2264%22 rx=%2214%22 fill=%22%23092838%22/%3E%3Cg transform=%22translate(32,32) scale(0.88) translate(-32,-32)%22%3E%3Cpath d=%22M12.5 13.5 L31.5 49.5 L47 21%22 fill=%22none%22 stroke=%22%2312a06a%22 stroke-width=%229.5%22 stroke-linejoin=%22miter%22/%3E%3Cpath d=%22M39.6 18.8 L58.4 7.2 L55.4 28.6 Z%22 fill=%22%23ffffff%22/%3E%3C/g%3E%3C/svg%3E">
<meta name="theme-color" content="#0f3c57">
<meta name="description" content="Console interno da plataforma Vyora.">
<style>
:root{
  /* institucional — azul petróleo */
  --brand:#0f3c57; --brand-2:#1a5c80; --brand-3:#092838; --brand-soft:#eaf1f6; --brand-line:#c9dbe6;
  /* crescimento */
  --grow:#12a06a; --grow-soft:#e6f6ef; --grow-deep:#0b7d51;
  --alert:#b45309; --alert-soft:#fdf3e7; --danger:#b3261e; --danger-soft:#fbeceb;
  /* neutros */
  --bg:#f5f7f8; --card:#ffffff; --line:#e6eaed; --line-2:#f1f4f5;
  --ink:#0f1b21; --ink-2:#485b64; --ink-3:#86959d;
  --r:16px;
  --sh:0 1px 1px rgba(15,27,33,.03), 0 6px 20px -14px rgba(15,27,33,.24);
  --sh-2:0 28px 70px -30px rgba(9,40,56,.5);
  --nav:268px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow-x:hidden}
body{background:var(--bg);color:var(--ink);font-size:14px;line-height:1.6;letter-spacing:-.005em;
  font-family:Inter,Manrope,"Segoe UI Variable","Segoe UI",-apple-system,BlinkMacSystemFont,Roboto,Helvetica,Arial,sans-serif;
  -webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale}
button,input,select,textarea{font-family:inherit;font-size:14px;color:inherit}
button{cursor:pointer}
a{color:var(--brand);text-decoration:none}
svg{display:block}
.hidden{display:none!important}
::-webkit-scrollbar{width:11px;height:11px}
::-webkit-scrollbar-thumb{background:#d2d9dd;border-radius:7px;border:3px solid transparent;background-clip:content-box}
::-webkit-scrollbar-track{background:transparent}
::selection{background:var(--brand-soft)}

/* ===================== ACESSO ===================== */
#login{min-height:100vh;display:grid;grid-template-columns:1.08fr .92fr;background:#fff}
@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes shake{20%{transform:translateX(-6px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(4px)}100%{transform:none}}
.perfil{border:1.5px solid var(--line);border-radius:16px;padding:18px 12px;background:#fff;text-align:center;transition:.16s;cursor:pointer}
.perfil:hover{border-color:var(--brand);transform:translateY(-3px);box-shadow:0 14px 30px -20px rgba(9,40,56,.55)}
.perfil .av{width:58px;height:58px;border-radius:18px;margin:0 auto 11px;font-size:19px}
.perfil b{display:block;font-size:13.5px;font-weight:620;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.perfil span{font-size:11.5px;color:var(--ink-3)}
.perfil.novo{border-style:dashed;display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--ink-3)}
@media(max-width:1000px){#login{grid-template-columns:1fr}}

/* ===================== ESTRUTURA ===================== */
#app{display:none;min-height:100vh}
.nav{position:fixed;inset:0 auto 0 0;width:var(--nav);background:#fff;border-right:1px solid var(--line);display:flex;flex-direction:column;z-index:60}
.nav-org{padding:24px 22px 20px;border-bottom:1px solid var(--line-2)}
.org{display:flex;align-items:center;gap:13px}
.org-logo{width:44px;height:44px;border-radius:13px;flex:none;overflow:hidden;display:flex;align-items:center;justify-content:center;
  background:linear-gradient(150deg,var(--brand-2),var(--brand-3));color:#fff;font-weight:650;font-size:14.5px;letter-spacing:.4px;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.18)}
.org-logo img{width:100%;height:100%;object-fit:cover}
.org-name{font-size:14.5px;font-weight:650;letter-spacing:-.3px;line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.org-sub{font-size:11.5px;color:var(--ink-3);margin-top:1px}
.nav-list{flex:1;overflow-y:auto;padding:16px 14px}
.nav-cap{font-size:10.5px;text-transform:uppercase;letter-spacing:1.1px;color:var(--ink-3);font-weight:650;padding:14px 12px 8px}
.nav-i{display:flex;align-items:center;gap:12px;width:100%;padding:10px 12px;border:none;background:none;border-radius:11px;
  color:var(--ink-2);font-size:14px;font-weight:500;margin-bottom:3px;position:relative;transition:.13s}
.nav-i svg{width:19px;height:19px;flex:none;stroke:currentColor;opacity:.85}
.nav-i:hover{background:var(--line-2);color:var(--ink)}
.nav-i.on{background:var(--brand-soft);color:var(--brand);font-weight:620}
.nav-i.on svg{opacity:1}
.nav-i.on::before{content:"";position:absolute;left:-14px;top:9px;bottom:9px;width:3px;border-radius:0 3px 3px 0;background:var(--brand)}
.nav-i .cnt{margin-left:auto;font-size:11px;font-weight:680;background:var(--alert-soft);color:var(--alert);min-width:20px;height:20px;
  border-radius:10px;display:flex;align-items:center;justify-content:center;padding:0 6px}
.nav-seal{padding:16px 22px 20px;border-top:1px solid var(--line-2)}
.seal{display:flex;align-items:center;gap:10px;color:var(--ink-3);font-size:11px;letter-spacing:.3px}
.seal b{color:var(--ink-2);font-weight:640;letter-spacing:1.6px;font-size:11px}
.seal i{font-style:normal;letter-spacing:1.2px;color:var(--ink-3)}
.seal .m{color:var(--brand);display:flex}

.shell{margin-left:var(--nav);min-height:100vh;display:flex;flex-direction:column}
.bar{height:70px;background:rgba(255,255,255,.9);backdrop-filter:saturate(180%) blur(10px);border-bottom:1px solid var(--line);
  display:flex;align-items:center;gap:18px;padding:0 34px;position:sticky;top:0;z-index:50}
.bar h1{font-size:17.5px;font-weight:640;letter-spacing:-.4px}
.bar .sub{font-size:12px;color:var(--ink-3);margin-top:-3px}
.bar-r{margin-left:auto;display:flex;align-items:center;gap:12px}
.gsearch{position:relative;width:320px}
.gsearch input{width:100%;height:40px;border:1px solid var(--line);border-radius:11px;background:#fbfcfd;padding:0 14px 0 38px;font-size:13.5px}
.gsearch input::placeholder{color:var(--ink-3)}
.gsearch input:focus{outline:none;background:#fff;border-color:var(--brand-line);box-shadow:0 0 0 3px rgba(15,60,87,.07)}
.gsearch .i{position:absolute;left:13px;top:11px;color:var(--ink-3)}
.gres{position:absolute;top:47px;left:0;right:0;background:#fff;border:1px solid var(--line);border-radius:14px;box-shadow:var(--sh-2);
  max-height:420px;overflow-y:auto;z-index:70;padding:7px}
.gres-i{padding:10px 12px;border-radius:10px;cursor:pointer}
.gres-i:hover{background:var(--brand-soft)}
.gres-i b{font-size:13.5px;font-weight:600;display:block}
.gres-i span{font-size:12px;color:var(--ink-3)}
.gres-c{font-size:10.5px;text-transform:uppercase;letter-spacing:1px;color:var(--ink-3);padding:9px 12px 5px;font-weight:650}
.me{display:flex;align-items:center;gap:11px;padding:6px 12px 6px 7px;border-radius:11px;border:1px solid var(--line);background:#fff}
.me:hover{background:var(--line-2)}
.av{width:32px;height:32px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:650;color:#fff;flex:none;
  background:linear-gradient(150deg,var(--brand-2),var(--brand-3))}
.me-t b{display:block;font-size:13px;font-weight:620;line-height:1.25;text-align:left}
.me-t span{font-size:11.5px;color:var(--ink-3)}
.pop{position:absolute;right:0;top:52px;background:#fff;border:1px solid var(--line);border-radius:14px;box-shadow:var(--sh-2);min-width:262px;z-index:80;padding:7px}
.pop-h{padding:10px 13px 7px;font-size:10.5px;text-transform:uppercase;letter-spacing:1px;color:var(--ink-3);font-weight:650}
.pop-i{padding:10px 13px;border-radius:10px;font-size:13.5px;cursor:pointer;display:flex;gap:11px;align-items:center;color:var(--ink-2)}
.pop-i:hover{background:var(--line-2);color:var(--ink)}
.pop-i.dg{color:var(--danger)}
.page{padding:32px 34px 96px;flex:1;max-width:1520px;width:100%}
.burger{display:none;width:38px;height:38px;border-radius:11px;border:1px solid var(--line);background:#fff;align-items:center;justify-content:center}
@media(max-width:1040px){
  .nav{transform:translateX(-100%);transition:transform .24s cubic-bezier(.32,.72,0,1)}
  .nav.open{transform:none;box-shadow:var(--sh-2)}
  .shell{margin-left:0}.burger{display:flex}.gsearch{width:auto;flex:1;min-width:120px}
  .bar{padding:0 16px;gap:12px}.page{padding:22px 16px 96px}
}

/* ===================== COMPONENTES ===================== */
.head{display:flex;align-items:flex-start;gap:18px;margin-bottom:26px;flex-wrap:wrap}
.head h2{font-size:24px;font-weight:660;letter-spacing:-.8px;line-height:1.25}
.head p{color:var(--ink-3);font-size:14px;margin-top:5px;max-width:70ch}
.head .act{margin-left:auto;display:flex;gap:9px;flex-wrap:wrap;align-items:center}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:40px;padding:0 17px;border-radius:11px;border:1px solid var(--line);
  background:#fff;font-size:13.5px;font-weight:560;color:var(--ink);white-space:nowrap;transition:.14s}
.btn:hover{background:var(--line-2);border-color:#dbe1e4}
.btn svg{width:16px;height:16px;stroke:currentColor}
.btn-p{background:var(--brand);border-color:var(--brand);color:#fff;box-shadow:0 1px 2px rgba(15,60,87,.24)}
.btn-p:hover{background:var(--brand-2);border-color:var(--brand-2)}
.btn-g{background:var(--grow);border-color:var(--grow);color:#fff}
.btn-g:hover{background:var(--grow-deep);border-color:var(--grow-deep)}
.btn-d{background:#fff;border-color:#eccbc9;color:var(--danger)}
.btn-d:hover{background:var(--danger-soft)}
.btn-s{height:34px;padding:0 12px;font-size:12.5px;border-radius:9px}
.btn-lg{height:48px;padding:0 24px;font-size:15px;border-radius:13px;font-weight:600}
.btn:disabled{opacity:.45;cursor:not-allowed}
.seg{display:inline-flex;background:var(--line-2);border-radius:11px;padding:3px;gap:2px}
.seg button{border:none;background:none;padding:7px 14px;border-radius:9px;font-size:12.5px;font-weight:560;color:var(--ink-2)}
.seg button.on{background:#fff;color:var(--brand);box-shadow:var(--sh);font-weight:640}

.grid{display:grid;gap:18px}
.c2{grid-template-columns:repeat(2,1fr)}.c3{grid-template-columns:repeat(3,1fr)}
.c4{grid-template-columns:repeat(4,1fr)}
@media(max-width:1120px){.c4{grid-template-columns:repeat(2,1fr)}.c3{grid-template-columns:1fr}}
@media(max-width:680px){.c2,.c4{grid-template-columns:1fr}}

.box{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh)}
.box-h{padding:20px 22px;display:flex;align-items:center;gap:14px;border-bottom:1px solid var(--line-2)}
.box-h h3{font-size:15px;font-weight:640;letter-spacing:-.25px}
.box-h p{font-size:12.5px;color:var(--ink-3);margin-top:2px}
.box-h .act{margin-left:auto;display:flex;gap:8px;align-items:center}
.box-b{padding:22px}

.kpi{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:20px 21px;box-shadow:var(--sh);
  transition:.16s;display:block;width:100%;text-align:left;position:relative;overflow:hidden}
button.kpi:hover{border-color:var(--brand-line);transform:translateY(-2px);box-shadow:0 10px 30px -18px rgba(9,40,56,.42)}
.kpi .t{font-size:12px;color:var(--ink-3);font-weight:600;letter-spacing:.1px}
.kpi .v{font-size:27px;font-weight:660;letter-spacing:-1.3px;margin-top:10px;font-variant-numeric:tabular-nums;line-height:1.15}
.kpi .f{font-size:12.5px;color:var(--ink-3);margin-top:7px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.kpi.pos .v{color:var(--grow-deep)}.kpi.neg .v{color:var(--danger)}.kpi.wr .v{color:var(--alert)}
.up{color:var(--grow-deep);font-weight:650;display:inline-flex;align-items:center;gap:3px}

table{width:100%;border-collapse:collapse}
th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.9px;color:var(--ink-3);font-weight:650;
  padding:13px 22px;border-bottom:1px solid var(--line-2);white-space:nowrap}
td{padding:15px 22px;border-bottom:1px solid var(--line-2);font-size:13.5px;vertical-align:middle}
tbody tr:last-child td{border-bottom:none}
tr.clik{cursor:pointer;transition:background .12s}
tr.clik:hover td{background:#fafbfc}
.tw{overflow-x:auto}
.r{text-align:right;font-variant-numeric:tabular-nums}
.mut{color:var(--ink-3)}.sm{font-size:12.5px}.b{font-weight:620}
.mono{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12.5px}

.void{padding:64px 28px;text-align:center;max-width:520px;margin:0 auto}
.void .ic{width:56px;height:56px;margin:0 auto 20px;border-radius:16px;background:var(--brand-soft);color:var(--brand);
  display:flex;align-items:center;justify-content:center}
.void .ic svg{width:26px;height:26px}
.void b{display:block;color:var(--ink);font-size:16px;font-weight:620;margin-bottom:7px;letter-spacing:-.3px}
.void p{color:var(--ink-3);font-size:13.5px;margin-bottom:20px;line-height:1.65}
.void .btn{display:inline-flex}

.tag{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:8px;font-size:11.5px;font-weight:620;white-space:nowrap}
.t-pos{background:var(--grow-soft);color:var(--grow-deep)}
.t-neg{background:var(--danger-soft);color:var(--danger)}
.t-wr{background:var(--alert-soft);color:var(--alert)}
.t-inf{background:var(--brand-soft);color:var(--brand)}
.t-mut{background:var(--line-2);color:var(--ink-2)}
.chip{display:inline-block;padding:4px 10px;border-radius:8px;background:var(--line-2);font-size:12px;color:var(--ink-2);font-weight:540}

.fld{margin-bottom:16px}
.fld label{display:block;font-size:12.5px;font-weight:600;margin-bottom:7px;color:var(--ink-2)}
.fld .rq{color:var(--danger)}
.fld input,.fld select,.fld textarea{width:100%;height:42px;border:1px solid var(--line);border-radius:11px;padding:0 13px;background:#fff;transition:.13s}
.fld textarea{height:auto;padding:11px 13px;resize:vertical}
.fld input:focus,.fld select:focus,.fld textarea:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 3px rgba(15,60,87,.09)}
.fld input:disabled{background:#f7f8f9;color:var(--ink-3)}
.rw{display:grid;gap:14px}
.rw2{grid-template-columns:1fr 1fr}.rw3{grid-template-columns:repeat(3,1fr)}
@media(max-width:680px){.rw2,.rw3{grid-template-columns:1fr}}
.filters{display:flex;gap:11px;align-items:center;flex-wrap:wrap;margin-bottom:20px}
.filters select,.filters input{height:40px;border:1px solid var(--line);border-radius:11px;padding:0 13px;background:#fff}
.srch{position:relative;flex:1;min-width:210px;max-width:360px}
.srch input{width:100%;padding-left:38px}
.srch .i{position:absolute;left:13px;top:11px;color:var(--ink-3)}

.dw-bg{position:fixed;inset:0;background:rgba(6,27,39,.46);z-index:90;opacity:0;transition:opacity .2s}
.dw-bg.on{opacity:1}
.dw{position:fixed;top:0;right:0;bottom:0;width:min(760px,96vw);background:var(--bg);z-index:91;display:flex;flex-direction:column;
  box-shadow:var(--sh-2);transform:translateX(100%);transition:transform .26s cubic-bezier(.32,.72,0,1)}
.dw.on{transform:none}
.dw-h{background:#fff;border-bottom:1px solid var(--line);padding:24px 28px 0}
.dw-h .top{display:flex;align-items:flex-start;gap:16px;margin-bottom:16px}
.dw-h h3{font-size:20px;font-weight:650;letter-spacing:-.6px}
.dw-h .sub{font-size:13.5px;color:var(--ink-3);margin-top:3px}
.dw-h .x{margin-left:auto;width:36px;height:36px;border-radius:10px;border:1px solid var(--line);background:#fff;
  display:flex;align-items:center;justify-content:center;color:var(--ink-2);flex:none}
.dw-h .x:hover{background:var(--line-2)}
.dw-b{flex:1;overflow-y:auto;padding:24px 28px 48px}
.tabs{display:flex;gap:26px;overflow-x:auto}
.tab{border:none;background:none;padding:12px 0 14px;font-size:13.5px;color:var(--ink-3);font-weight:550;border-bottom:2px solid transparent;white-space:nowrap}
.tab:hover{color:var(--ink-2)}
.tab.on{color:var(--brand);border-bottom-color:var(--brand);font-weight:640}
.dw-act{display:flex;gap:9px;padding:16px 28px;background:#fff;border-top:1px solid var(--line);flex-wrap:wrap}

.md-bg{position:fixed;inset:0;background:rgba(6,27,39,.48);z-index:100;display:flex;align-items:flex-start;justify-content:center;padding:44px 16px;overflow-y:auto}
.md{background:#fff;border-radius:18px;width:100%;max-width:580px;box-shadow:var(--sh-2);animation:fadeUp .18s ease}
.md.w{max-width:900px}
.md-h{padding:24px 26px 18px;border-bottom:1px solid var(--line-2);display:flex;align-items:center;gap:14px}
.md-h h3{font-size:17.5px;font-weight:650;letter-spacing:-.4px}
.md-h .x{margin-left:auto;width:34px;height:34px;border-radius:10px;border:1px solid var(--line);background:#fff;display:flex;align-items:center;justify-content:center;color:var(--ink-2)}
.md-b{padding:26px;max-height:calc(100vh - 250px);overflow-y:auto}
.md-f{padding:18px 26px;border-top:1px solid var(--line-2);display:flex;justify-content:flex-end;gap:10px;background:#fbfcfd;border-radius:0 0 18px 18px}

.toasts{position:fixed;right:24px;bottom:96px;z-index:200;display:flex;flex-direction:column;gap:10px}
.tst{background:var(--brand-3);color:#fff;padding:14px 18px;border-radius:13px;font-size:13.5px;max-width:380px;
  box-shadow:var(--sh-2);animation:fadeUp .2s ease;display:flex;gap:11px;align-items:flex-start}
.tst.ok{background:var(--grow-deep)}.tst.er{background:var(--danger)}
.note{border:1px solid var(--line);border-radius:13px;padding:15px 17px;font-size:13.5px;display:flex;gap:12px;align-items:flex-start;margin-bottom:20px;background:#fff;line-height:1.65}
.note.inf{background:var(--brand-soft);border-color:var(--brand-line);color:#0c3346}
.note.wr{background:var(--alert-soft);border-color:#f0dcc2;color:#8a4409}
.note.ng{background:var(--danger-soft);border-color:#f0cdcb;color:#93201a}
.note.gd{background:var(--grow-soft);border-color:#c3e8d7;color:var(--grow-deep)}
.note svg{flex:none;margin-top:2px;width:17px;height:17px}

.spark{width:100%;height:auto;overflow:visible}
.gl{stroke:#eef1f2;stroke-width:1}
.lbl{font-size:10.5px;fill:var(--ink-3);font-family:inherit}
.hb{display:flex;align-items:center;gap:14px;padding:9px 0}
.hb-n{width:170px;flex:none;font-size:13.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hb-t{flex:1;height:9px;background:var(--line-2);border-radius:6px;overflow:hidden}
.hb-f{height:100%;border-radius:6px;background:var(--brand);transition:width .35s ease}
.hb-v{width:124px;text-align:right;flex:none;font-size:13.5px;font-weight:620;font-variant-numeric:tabular-nums}
.pg{height:7px;background:var(--line-2);border-radius:5px;overflow:hidden}
.pg span{display:block;height:100%;background:var(--grow);border-radius:5px;transition:width .35s}
.ln{display:flex;justify-content:space-between;align-items:center;gap:16px;padding:12px 0;border-bottom:1px solid var(--line-2);font-size:13.5px}
.ln:last-child{border-bottom:none}
.ln .k{color:var(--ink-2)}
.ln .v{font-weight:620;font-variant-numeric:tabular-nums;text-align:right}
.msg{max-width:78%;padding:12px 15px;border-radius:15px;font-size:13.5px;line-height:1.6;position:relative}
.msg .quem{font-size:11px;opacity:.75;margin-bottom:4px;font-weight:600}
@media(max-width:900px){
  .page{padding-bottom:280px}
}

@keyframes shine{0%{transform:translateX(-100%)}55%,100%{transform:translateX(220%)}}

@keyframes pop{0%{transform:scale(.7);opacity:0}60%{transform:scale(1.08)}100%{transform:scale(1);opacity:1}}

@keyframes fall{to{transform:translateY(105vh) rotate(720deg);opacity:.9}}
@media print{.nav,.bar,.head .act,.filters{display:none!important}.shell{margin:0}.page{padding:0}}

/* ---- console ---- */
#login.cs-login{min-height:100vh;display:grid;grid-template-columns:1fr;place-items:center;
  background:linear-gradient(150deg,var(--brand-3),var(--brand) 60%,var(--brand-2))}
.cs-card{width:min(420px,92vw);background:#fff;border-radius:20px;padding:34px 32px;box-shadow:0 30px 80px rgba(4,20,30,.4)}
.cs-card h2{font-size:21px;letter-spacing:-.6px;margin:16px 0 4px}
.cs-card .sub{font-size:13.5px;color:var(--ink-3);margin-bottom:22px}
.cs-eq{display:flex;flex-direction:column;gap:8px;margin-top:20px;border-top:1px solid var(--line);padding-top:16px}
.cs-eq button{display:flex;gap:11px;align-items:center;padding:9px 11px;border-radius:11px;border:1px solid transparent;background:none;cursor:pointer;text-align:left;width:100%}
.cs-eq button:hover{background:var(--brand-soft)}
.cs-eq b{font-size:13px;display:block;font-weight:620}
.cs-eq span{font-size:11.5px;color:var(--ink-3)}
.kb{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(230px,1fr);gap:14px;overflow-x:auto;padding-bottom:10px}
.kb-col{background:var(--bg-2);border:1px solid var(--line);border-radius:14px;padding:12px;min-height:150px}
.kb-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:11px;font-size:11.5px;letter-spacing:.7px;text-transform:uppercase;color:var(--ink-3);font-weight:660}
.kb-h .q{background:#fff;border:1px solid var(--line);border-radius:20px;padding:1px 8px;font-size:11px;color:var(--ink-2)}
.kb-c{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:9px;cursor:pointer;transition:.14s}
.kb-c:hover{border-color:var(--brand-line);box-shadow:0 6px 18px rgba(15,60,87,.09);transform:translateY(-1px)}
.kb-c b{font-size:13.5px;font-weight:640;display:block}
.kb-c .sm{margin-top:3px}
.imp{position:fixed;left:0;right:0;bottom:0;z-index:80;background:var(--alert);color:#3a2a00;display:flex;gap:14px;align-items:center;justify-content:center;padding:11px 16px;font-size:13px;font-weight:600;box-shadow:0 -6px 20px rgba(0,0,0,.14)}
.lic{display:flex;flex-direction:column;gap:5px;padding:13px 0;border-top:1px solid var(--line-2)}
.lic-t{display:flex;justify-content:space-between;font-size:13px}
.lic-t b{font-weight:640}

/* ---------- acessos na nuvem ---------- */
.ac-p{display:flex;align-items:center;gap:12px;padding:12px 0;flex-wrap:wrap}
.ac-p .av{width:36px;height:36px;border-radius:11px;font-size:12.5px;flex:none}
.ac-p b{font-size:13.5px}
@media(max-width:560px){.ac-p .btn{flex:1}}

/* ---------- leads do site: kanban ---------- */
.kan{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(232px,1fr);gap:12px;
  overflow-x:auto;padding-bottom:8px;align-items:start}
.kcol{background:var(--bg);border:1px solid var(--line);border-radius:14px;padding:10px;min-height:180px;
  transition:.15s}
.kcol.sobre{border-color:var(--brand);background:var(--brand-soft)}
.kcol.ok{border-color:var(--grow)}
.kcol.off{opacity:.85}
.kcol-h{display:flex;align-items:center;gap:8px;padding:2px 4px 10px}
.kcol-h b{font-size:12.5px;font-weight:660}
.kcol-h span{margin-left:auto;font-size:11.5px;color:var(--ink-3);background:var(--card);
  border:1px solid var(--line);border-radius:999px;padding:1px 8px}
.kcol-b{display:flex;flex-direction:column;gap:8px;min-height:60px}
.kvazio{font-size:11.5px;color:var(--ink-3);text-align:center;padding:18px 6px;border:1px dashed var(--line);border-radius:10px}
.kd{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:11px 12px;cursor:grab;
  box-shadow:var(--sh);transition:.14s}
.kd:hover{border-color:var(--brand-line);transform:translateY(-1px)}
.kd.indo{opacity:.45}
.kd b{display:block;font-size:13px;font-weight:650;line-height:1.3}
.kd-s{font-size:11.5px;color:var(--ink-3);margin-top:3px}
.kd-n{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px}
.kd-n span{font-size:10.5px;color:var(--ink-2);background:var(--bg);border:1px solid var(--line);
  border-radius:999px;padding:2px 7px}
.kd-n .ad{color:var(--grow-deep);border-color:var(--grow)}
.kd-m{margin-top:7px;font-size:11px;color:var(--danger)}
.kd-d{margin-top:7px;font-size:10.5px;color:var(--ink-3)}
.ld-o{margin-top:12px;padding-left:12px;border-left:2px solid var(--line);font-size:13px;
  color:var(--ink-2);line-height:1.6}
@media(max-width:760px){.kan{grid-auto-columns:minmax(210px,80%)}}

</style>
</head>
<body>

<!-- ===================== ACESSO DA EQUIPE VYORA ===================== -->
<div id="login" class="cs-login">
  <div class="cs-card">
    <div id="cs-brand"></div>
    <h2>Console Vyora</h2>
    <div class="sub">Ambiente interno da plataforma. Acesso exclusivo da Vyora.</div>
    <form onsubmit="event.preventDefault();doLogin()">
      <div class="fld"><label>E-mail corporativo</label><input id="cs-mail" autocomplete="username" placeholder="vyoramkt@gmail.com"></div>
      <div class="fld"><label>Senha</label><input id="cs-pass" type="password" autocomplete="current-password" placeholder="••••••"></div>
      <div id="cs-err" class="note ng hidden"></div>
      <button class="btn btn-p btn-lg" style="width:100%" type="submit">Entrar no console</button>
    </form>
    <div class="cs-eq" id="cs-equipe"></div>
  </div>
</div>

<!-- ===================== CONSOLE ===================== -->
<div id="app">
  <aside class="nav" id="nav">
    <div class="nav-org">
      <div class="org">
        <div class="org-logo" id="org-logo">V</div>
        <div class="org-txt">
          <div class="org-name">Vyora</div>
          <div class="org-sub">Console da plataforma</div>
        </div>
      </div>
    </div>
    <div class="nav-list" id="nav-list"></div>
    <div class="nav-seal"><div class="seal" id="seal"></div></div>
  </aside>

  <div class="shell">
    <header class="bar">
      <button class="burger" onclick="document.getElementById('nav').classList.toggle('open')" aria-label="Menu">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
      </button>
      <div>
        <h1 id="bar-t">Dashboard executivo</h1>
        <div class="sub" id="bar-s"></div>
      </div>
      <div class="bar-r">
        <div class="gsearch">
          <span class="i"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.2-3.2"/></svg></span>
          <input id="gq" placeholder="Buscar empresa, CNPJ ou token" autocomplete="off"
                 oninput="buscaConsole(this.value)" onblur="setTimeout(function(){el('gres').classList.add('hidden')},180)">
          <div id="gres" class="gres hidden"></div>
        </div>
        <div style="position:relative">
          <button class="me" onclick="togglePop(event)">
            <span class="av" id="me-av">—</span>
            <span class="me-t"><b id="me-n">—</b><span id="me-r">—</span></span>
          </button>
          <div id="me-pop" class="pop hidden"></div>
        </div>
      </div>
    </header>
    <main class="page" id="page"></main>
  </div>
</div>

<div id="dw-root"></div>
<div id="md-root"></div>
<div class="toasts" id="toasts"></div>

  return s;
}
function hashSenha(senha, salt) {

  for (var i = 0; i < SEC_ITER; i++) h = sha256(h + salt);

}

  if (SENHAS_FRACAS.indexOf(s.toLowerCase()) >= 0) return "Esta senha é comum demais. Escolha outra.";
  if (/^(\d)\1+$/.test(s)) return "Não use o mesmo número repetido.";
  if (/^\d+$/.test(s) && s.length < 8) return "Só números é frágil. Misture letras.";
  var pri = String(nome || "").trim().split(/\s+/)[0];
  if (pri && pri.length > 2 && s.toLowerCase().indexOf(pri.toLowerCase()) >= 0) return "Não use seu nome na senha.";

  tk = String(tk || "").toUpperCase().replace(/\s/g, "");

  if (String(t.token).toUpperCase() === tk) return "atual";
  if (t.token_anterior && String(t.token_anterior).toUpperCase() === tk && t.token_graca_ate && dt(t.token_graca_ate) >= dt(today())) return "anterior";

  t.token = gerarToken();

  t.token_trocado_em = today();

  if (t.token_historico.length > 12) t.token_historico = t.token_historico.slice(-12);

function renovarTokensVencidos() {
  var trocados = [];
  DB.tenants.forEach(function (t) {
    if (t.id === "vyora" || !t.token) return;
    if (!t.token_validade) { t.token_validade = addM(t.criada || today(), cfgToken().meses); trocados.push(t); return; }
    if (tokenVencido(t)) { renovarToken(t, "validade trimestral atingida", "sistema"); trocados.push(t); }
  });
  if (trocados.length) save();

/* ---------- backup protegido por senha ----------
   Fluxo de cifra próprio: chave derivada por SHA-256 iterado e fluxo XOR.
   Serve para o arquivo não ser legível se cair na mão errada. Não substitui
   a criptografia do servidor, que entra quando o banco for para a nuvem. */
function _fluxo(chave, n) {
  var out = [], bloco = "", i = 0;
  while (out.length < n) {
    bloco = sha256(chave + "#" + i);
    for (var j = 0; j < bloco.length; j += 2) out.push(parseInt(bloco.substr(j, 2), 16));
    i++;
  }
  return out;
}
function cifrar(texto, senha) {
  var salt = novoSalt(), chave = hashSenha(senha, salt);
  var bytes = [], c, k = 0;
  for (var i = 0; i < texto.length; i++) {
    c = texto.charCodeAt(i);
    if (c < 128) bytes.push(c);
    else if (c < 2048) bytes.push(192 | (c >> 6), 128 | (c & 63));
    else bytes.push(224 | (c >> 12), 128 | ((c >> 6) & 63), 128 | (c & 63));
  }
  var fl = _fluxo(chave, bytes.length), hex = "";
  for (k = 0; k < bytes.length; k++) hex += ("0" + ((bytes[k] ^ fl[k]) & 255).toString(16)).slice(-2);
  return JSON.stringify({ vyora: "backup", v: 1, salt: salt, verif: sha256(chave).substring(0, 16), dados: hex });
}
function decifrar(pacote, senha) {
  var p;
  try { p = JSON.parse(pacote); } catch (e) { return null; }
  if (!p || p.vyora !== "backup") return null;
  var chave = hashSenha(senha, p.salt);
  if (sha256(chave).substring(0, 16) !== p.verif) return "senha";
  var n = p.dados.length / 2, fl = _fluxo(chave, n), bytes = [];
  for (var i = 0; i < n; i++) bytes.push((parseInt(p.dados.substr(i * 2, 2), 16) ^ fl[i]) & 255);
  var out = "", c, i2 = 0;
  while (i2 < bytes.length) {
    c = bytes[i2];
    if (c < 128) { out += String.fromCharCode(c); i2 += 1; }
    else if (c < 224) { out += String.fromCharCode(((c & 31) << 6) | (bytes[i2 + 1] & 63)); i2 += 2; }
    else { out += String.fromCharCode(((c & 15) << 12) | ((bytes[i2 + 1] & 63) << 6) | (bytes[i2 + 2] & 63)); i2 += 3; }
  }
  return out;
}

/* garante que exista o ambiente da Vyora e exatamente um acesso com poder total */
function garantirAcesso() {
  var mudou = false;
  if (!find(DB.tenants, "vyora")) {
    DB.tenants.push({
      id: "vyora", nome: "Vyora", slug: "console", token: "VY-VYRA-ADMN", cidade: "", uf: "", cnpj: "",
      segmento: "Plataforma", matriz_id: null, status: "ativo", situacao: "ativa", criada: today(), licenca: null
    });
    mudou = true;
  }
  var l = DB.users.filter(function (u) { return u.tenant_id === "vyora"; });
  if (!l.length) { criarAcesso("Vyora", VYORA_EMAIL); mudou = true; }
  else {
    /* bancos antigos podiam ter vários usuários internos: fica o primeiro ativo */
    var principal = l.filter(function (u) { return u.status === "ativo"; })[0] || l[0];
    principal.status = "ativo";
    if (principal.papel) { delete principal.papel; mudou = true; }
    if (principal.cargo !== "Vyora") { principal.cargo = "Vyora"; mudou = true; }
    l.forEach(function (u) {
      if (u.id !== principal.id) {
        DB.users = DB.users.filter(function (x) { return x.id !== u.id; });
        mudou = true;
      }
    });
  }
  return mudou;
}
function migrar() {
  var mudou = false;
  if (garantirAcesso()) mudou = true;
  /* qualquer coleção que o console leia precisa existir, mesmo vindo de banco antigo */
  COLECOES.forEach(function (c) {
    if (!Array.isArray(DB[c])) { DB[c] = []; mudou = true; }
  });
  if (!DB.rede) { DB.rede = { buscar_ativo: false, minimo_empresas: 3, growth: { email: VYORA_EMAIL, whatsapp: VYORA_ZAP } }; mudou = true; }
  if (!DB.rede.growth) { DB.rede.growth = { email: VYORA_EMAIL, whatsapp: VYORA_ZAP }; mudou = true; }
  /* contatos de exemplo que sobraram de versões anteriores viram os reais */
  if (corrigirContato(DB.rede.growth)) mudou = true;
  var cv = contaVyora();
  if (cv && contatoDeExemplo(cv.email)) {
    auditarSilencioso("E-mail de acesso atualizado", cv.email, VYORA_EMAIL);
    cv.email = VYORA_EMAIL; mudou = true;
  }
  /* o sistema do cliente também grava DB.global — complete o que faltar, chave a chave */
  if (!DB.global) { DB.global = {}; mudou = true; }
  var PADRAO_GLOBAL = {
    empresa: "Vyora", email: VYORA_EMAIL, whatsapp: VYORA_ZAP,
    dias_suspensao: 60, avisos: [7, 15, 30, 45], senha_min: 8, sessao_horas: 8,
    token_meses: 3, token_graca_dias: 7, url_sistema: "vyora-sistema-gestao.html",
    exige_aprovacao: true, provisiona_sem_pagamento: false
  };
  for (var gk in PADRAO_GLOBAL) {
    if (PADRAO_GLOBAL.hasOwnProperty(gk) && DB.global[gk] == null) { DB.global[gk] = PADRAO_GLOBAL[gk]; mudou = true; }
  }
  if (corrigirContato(DB.global)) mudou = true;
  DB.tenants.forEach(function (t) {
    if (t.id === "vyora") return;
    if (!t.situacao) { t.situacao = t.status === "ativo" ? "ativa" : "suspensa"; mudou = true; }
    if (t.provisionado == null) { t.provisionado = true; mudou = true; }
    /* toda empresa nasce operacional; holding só existe se a Vyora marcar */
    if (!t.tipo) { t.tipo = "empresa"; mudou = true; }
    if (t.licenca && !t.licenca.modulos) { t.licenca.modulos = MODULOS_PADRAO.slice(); mudou = true; }
    if (t.licenca && !t.licenca.limites) {
      /* bancos antigos guardavam um "plano"; vira limite próprio da empresa */
      var antigos = { essencial: { admins: 2, pdvs: 3, operacionais: 2, armazenamento: 5 },
        operacional: { admins: 2, pdvs: 3, operacionais: 4, armazenamento: 20 },
        grupo: { admins: 4, pdvs: 8, operacionais: 10, armazenamento: 50 } };
      t.licenca.limites = antigos[t.licenca.plano] || { admins: 2, pdvs: 2, operacionais: 2, armazenamento: 5 };
      delete t.licenca.plano;
      mudou = true;
    }
    if (t.licenca && !t.licenca.extras) { t.licenca.extras = {}; mudou = true; }
    if (t.tipo === "holding" && t.licenca && t.licenca.limites && t.licenca.limites.empresas == null) {
      t.licenca.limites.empresas = Math.max(LIMITES_PADRAO.empresas, daRede(t.id).length);
      mudou = true;
    }
    if (t.tipo === "holding" && t.licenca && t.licenca.modulos.indexOf("consolidado") < 0) {
      t.licenca.modulos.push("consolidado"); mudou = true;
    }
    if (!DB.implantacoes.filter(function (i) { return i.tenant_id === t.id; }).length) {
      DB.implantacoes.push(novaImplantacao(t, t.situacao === "ativa"));
      mudou = true;
    }
    if (!DB.contratos.filter(function (c) { return c.tenant_id === t.id; }).length) {
      DB.contratos.push({
        id: uid("ct"), tenant_id: t.id, versao: 1, status: t.situacao === "ativa" ? "assinado" : "pendente",
        enviado: t.criada, assinado: t.situacao === "ativa" ? t.criada : null,
        arquivo: "contrato-" + t.slug + "-v1.pdf", aditivos: [], obs: ""
      });
      mudou = true;
    }
  });
  if (mudou) save();
}

    recebida: r2(sum(f.filter(function (x) { return x.status === "paga"; }), function (x) { return x.valor; })),
    atraso: r2(sum(f.filter(function (x) { return x.status === "vencida"; }), function (x) { return x.valor; }))

function salvarEmpresa(id) {
  var nome = v("em-nome"), mail = v("em-mail");

  if (!id && mail.indexOf("@") < 0) return toast("Informe o e-mail do administrador.", "err");
  var slug = (v("em-slug") || nome).toLowerCase().replace(/[^a-z0-9]/g, "").substring(0, 18);
  var campos = {
    razao: v("em-razao"), cnpj: v("em-cnpj"), ie: v("em-ie"), segmento: v("em-seg"), cidade: v("em-cid"),

    whats: dig(v("em-whats")), representante: v("em-rep"), email: mail, slug: slug
  };

        if (vagasRede(alvo).cheia) return toast("A rede " + alvo.nome + " está no limite contratado.", "err");
      }

        t.id, matAntes ? nomeEmpresa(matAntes) : "independente", mat ? nomeEmpresa(mat) : "independente");
    }
    auditar("Cadastro da empresa alterado", nome, "", t.id, antes, nome);
    save(); fecharModal(); toast("Cadastro atualizado.", "ok"); verEmpresa(id, "empresa");
    return;
  }
  var mnova = el("em-matriz") ? v("em-matriz") || null : null;
  if (mnova) {
    var hd2 = find(DB.tenants, mnova);
    if (!ehHolding(hd2)) return toast("Só uma holding pode receber empresas.", "err");
    if (vagasRede(hd2).cheia) return toast("A rede " + hd2.nome + " está no limite contratado.", "err");
  }
  var novo = {
    id: uid("t"), nome: nome, tipo: "empresa", status: "ativo", situacao: "contrato_assinado", provisionado: false,
    criada: today(), matriz_id: mnova, token: null, licenca: null, obs: "", tags: []
  };
  for (var k2 in campos) if (campos.hasOwnProperty(k2)) novo[k2] = campos[k2];
  novo.licenca = {
    tipo: "vitalicia", valor_licenca: nv("em-lic"), valor: nv("em-man"),
    dia_venc: Math.min(28, Math.max(1, nv("em-dia") || 10)),
    inicio: today(), pagamento_inicial: false, status: "pendente",
    modulos: MODULOS_PADRAO.slice(), extras: {},
    limites: {
      admins: Math.max(1, nv("em-adm") || LIMITES_PADRAO.admins),
      pdvs: Math.max(0, nv("em-pdv") || LIMITES_PADRAO.pdvs),
      operacionais: Math.max(0, nv("em-op") || LIMITES_PADRAO.operacionais),
      armazenamento: LIMITES_PADRAO.armazenamento
    }
  };
  DB.tenants.push(novo);
  DB.contratos.push({
    id: uid("ct"), tenant_id: novo.id, versao: 1, status: "assinado", enviado: today(), assinado: today(),
    arquivo: "contrato-" + slug + "-v1.pdf", aditivos: [], obs: ""
  });
  DB.implantacoes.push(novaImplantacao(novo, false));
  auditar("Empresa cadastrada", nome, "licença " + money(novo.licenca.valor_licenca) + " · manutenção " + money(novo.licenca.valor), novo.id);
  save(); fecharModal();
  toast("Empresa cadastrada. Confirme o pagamento inicial para criar o ambiente.", "ok");

function confirmarProvisionamento(id) {
  var t = find(DB.tenants, id), senha = v("pv-senha") || senhaProvisoria();
  if (senha.length < 4) return toast("A senha temporária precisa de pelo menos 4 caracteres.", "err");
  provisionar(t, senha);
  fecharModal();
  verEmpresa(id, "licenca");
  modalCredenciais(id);

function provisionar(t, senhaEscolhida) {
  if (!t.token) { t.token = gerarToken(); t.token_validade = cfgToken().meses ? addM(today(), cfgToken().meses) : null; }
  t.licenca.pagamento_inicial = true;
  t.licenca.status = "ativa";
  t.provisionado = true;
  t.situacao = "implantacao";
  t.implantada = today();
  if (!DB.config.filter(function (c) { return c.tenant_id === t.id; }).length) DB.config.push(novaConfig(t.id, t.nome));
  if (!DB.users.filter(function (u) { return u.tenant_id === t.id; }).length) {
    var hold = ehHolding(t);
    var adm = {
      id: uid("u"), tenant_id: t.id, nome: hold ? "Gestor da rede" : "Administrador",
      email: t.email, perfil: hold ? "holding" : "admin",
      cargo: hold ? "Gestor do grupo empresarial" : "Administrador da empresa",
      tel: t.tel || "", status: "ativo", acesso: null, trocar_senha: true
    };
    t.senha_provisoria = senhaEscolhida || senhaProvisoria();
    adm.provisoria = t.senha_provisoria;
    protegerSenha(adm, t.senha_provisoria);
    DB.users.push(adm);
    /* a conta na nuvem nasce junto com o ambiente — sem passo manual */
    criarContaNuvemConsole(adm.email, t.senha_provisoria, t.id,
      hold ? "holding" : "admin", adm.nome);
  }
  /* e o servidor passa a saber quem é esta empresa e de qual rede */
  registrarEmpresaNuvem(t);
  /* o ambiente vai junto: o cliente entra do computador dele no mesmo dia */
  publicarAmbienteConsole(t);
  gerarFaturas(t);
  var im = implantacaoDe(t.id) || (DB.implantacoes.push(novaImplantacao(t, false)), implantacaoDe(t.id));
  im.etapa = "implantacao";
  im.checklist[0].ok = true; im.checklist[1].ok = true; im.checklist[2].ok = true;
  im.historico.push({ etapa: "pagamento_confirmado", data: today(), user_id: Sess.user_id });
  im.historico.push({ etapa: "implantacao", data: today(), user_id: Sess.user_id });
  auditar("Ambiente provisionado", t.nome, "token " + t.token, t.id, "sem ambiente", "ambiente ativo");
  save();
}

function salvarPlanoEmpresa(id) {
  var t = find(DB.tenants, id), u = usoLicenca(t);
  var novoAdm = Math.max(1, nv("pl-adm")), novoPdv = Math.max(0, nv("pl-pdv")), novoOp = Math.max(0, nv("pl-op"));
  if (novoAdm < u.admins.uso) return toast("A empresa já usa " + u.admins.uso + " administradores. Desative um antes de reduzir.", "err");
  if (novoPdv < u.pdvs.uso) return toast("A empresa já usa " + u.pdvs.uso + " PDVs. Desative um antes de reduzir.", "err");
  var antes = limites(t).admins + " adm / " + limites(t).pdvs + " PDV · " + money(t.licenca.valor) + "/mês" +
    (ehHolding(t) ? " · " + limiteEmpresas(t) + " empresas" : "");
  var novoEmp = ehHolding(t) ? Math.max(1, nv("pl-emp") || limiteEmpresas(t)) : null;
  if (novoEmp != null && novoEmp < daRede(t.id).length)
    return toast("A rede já tem " + daRede(t.id).length + " empresas vinculadas. Desvincule uma antes de reduzir o limite.", "err");
  t.licenca.limites = { admins: novoAdm, pdvs: novoPdv, operacionais: novoOp, armazenamento: Math.max(1, nv("pl-arm") || 5) };
  if (novoEmp != null) t.licenca.limites.empresas = novoEmp;
  t.licenca.extras = {};
  t.licenca.valor_licenca = nv("pl-lic");
  t.licenca.valor = nv("pl-valor");
  t.licenca.dia_venc = Math.min(28, Math.max(1, nv("pl-dia") || 10));
  var depois = novoAdm + " adm / " + novoPdv + " PDV · " + money(t.licenca.valor) + "/mês";
  auditar("Valores e limites alterados", t.nome, "", t.id, antes, depois);
  save(); fecharModal(); toast("Atualizado.", "ok"); verEmpresa(id, "licenca");
}
function modalExcluirEmpresa(id) {
  var t = find(DB.tenants, id);
  var regs = registrosDaEmpresa(id) + DB.users.filter(function (u) { return u.tenant_id === id; }).length;
  modal("Excluir " + esc(t.nome),
    nota("Isso remove a empresa e <b>todo o conteúdo dela</b>: usuários, clientes, vendas, parcelas, caixa, títulos, contrato e implantação. " +
      "Não tem volta. Se a intenção for só bloquear o acesso, use <b>Suspender</b> — a suspensão preserva tudo.", "ng") +
    ln("Empresa", t.nome) + ln("Registros que serão apagados", String(regs)) +
    ln("Situação atual", sitNome(t.situacao)) +
    '<div class="fld" style="margin-top:12px"><label>Digite o nome da empresa para confirmar</label><input id="ex-nome" placeholder="' + esc(t.nome) + '"></div>',
    '<button class="btn" onclick="fecharModal()">Cancelar</button>' +
    '<button class="btn btn-d" onclick="excluirEmpresa(\'' + id + '\')">Excluir definitivamente</button>');

function excluirEmpresa(id) {
  var t = find(DB.tenants, id);
  if (v("ex-nome").trim().toLowerCase() !== String(t.nome).trim().toLowerCase())
    return toast("Digite o nome exato da empresa para confirmar.", "err");
  var nome = t.nome, regs = registrosDaEmpresa(id);
  ["customers", "products", "moves", "sales", "parcels", "cash", "metas", "cobrancas", "acordos", "leads",
    "faturas", "tickets", "growth", "solicitacoes", "implantacoes", "contratos", "config", "users", "sessoes"].forEach(function (c) {
      DB[c] = (DB[c] || []).filter(function (x) { return x.tenant_id !== id; });
    });
  DB.tenants = DB.tenants.filter(function (x) { return x.id !== id; });
  /* a decisão fica registrada: nada que venha da nuvem recria esta
     empresa, nem aqui nem no sistema, que divide este mesmo banco */
  DB.removidos = DB.removidos || [];
  if (DB.removidos.indexOf(id) < 0) DB.removidos.push(id);
  /* e o que estiver no servidor sai junto */
  limparEmpresaNaNuvem(id, nome);
  auditar("Empresa excluída", nome, regs + " registro(s) removidos", null, "ativa", "excluída");
  save(); fecharModal(); toast(nome + " foi excluída.", "ok"); ir("empresas");
}
/* tira do servidor o que sustentava a empresa: o ambiente (que abriria
   um computador novo), o acesso das pessoas e o lugar dela no mapa da
   rede. Se a internet falhar, o que já foi apagado aqui continua
   apagado — a lista de removidas garante isso. */
function limparEmpresaNaNuvem(id, nome) {
  if (!supaConfigurado() || !supaAutenticado()) return;
  supaPedido("/rest/v1/rpc/apagar_dados_da_empresa", {
    method: "POST", body: JSON.stringify({ empresa: id })
  }).then(function (r) {
    if (!r.ok) return toast("A empresa saiu daqui, mas o servidor recusou a limpeza (" + r.status + "). Ela não volta para esta tela.", "err");
    auditar("Dados apagados no servidor", nome || id, "ambiente, acessos e operação");
    save();
  }).catch(function () {
    toast("A empresa saiu daqui. Sem resposta do servidor agora — tente a limpeza de novo mais tarde.", "err");
  });
}

function diasDe(iso2) {
  var d = dDiff(String(iso2).substring(0, 10), today());
  return d === 0 ? "hoje" : d === 1 ? "ontem" : "há " + d + " dias";
}
function tempoMedioResposta() {
  var l = DB.solicitacoes.filter(function (s) { return s.decidida; });
  if (!l.length) return "—";
  var m = sum(l, function (s) { return dDiff(String(s.data).substring(0, 10), String(s.decidida).substring(0, 10)); }) / l.length;
  return m < 1 ? "menos de 1 dia" : Math.round(m) + " dia(s)";
}
function analisar(id) {
  var s = find(DB.solicitacoes, id), t = find(DB.tenants, s.tenant_id), u = usoLicenca(t);
  var campo = (TIPO_SOL[s.tipo] || {}).campo;
  var corpo = '<div style="display:flex;gap:12px;align-items:center;margin-bottom:14px">' +
    '<span class="av" style="width:40px;height:40px;border-radius:12px">' + ini2(t.nome) + "</span>" +
    "<div><b>" + esc(t.nome) + '</b><div class="sm mut">' + esc(resumoLicenca(t)) + " · " + sitNome(t.situacao) + "</div></div>" +
    '<div style="margin-left:auto">' + stSol(s.status) + "</div></div>";
  corpo += ln("Pedido", tipoSol(s.tipo) + (s.qtd ? " · " + s.qtd + " " + (TIPO_SOL[s.tipo] || {}).unid : "")) +
    ln("Solicitante", s.solicitante) + ln("Recebido em", fdt(s.data)) + ln("Urgência", s.urgencia) +

  if (campo) {
    var o = u[campo] || { uso: 0, lim: 0 };
    corpo += nota("Hoje a empresa usa <b>" + o.uso + " de " + o.lim + "</b>. Aprovando, o limite passa para <b>" +
      (o.lim + (s.qtd || 1)) + "</b>.", "inf");
  }
  if (s.tipo === "nova_empresa") {
    var vg = vagasRede(t);
    corpo += ln("Empresa pedida", s.empresa_nome || "—") +
      ln("Cidade", s.empresa_cidade || "—") + ln("Segmento", s.empresa_segmento || "—") +
      ln("Rede hoje", vg.uso + " de " + vg.limite + " empresas");
    corpo += nota(vg.cheia
      ? "A rede está <b>no limite</b>. Aprovar amplia o limite para <b>" + (vg.limite + 1) + "</b> empresas. " +
        "A empresa em si continua sendo cadastrada por você, com licença e manutenção próprias."
      : "A rede ainda tem <b>" + vg.livres + " vaga(s)</b>. Aprovar libera o cadastro; você define a licença e a manutenção da nova empresa.",
      vg.cheia ? "wr" : "inf");
  }
  if (s.status === "pendente" || s.status === "analise") {
    corpo += '<div class="rw rw2" style="margin-top:12px"><div class="fld"><label>Cobrança adicional (opcional)</label><input id="sl-valor" placeholder="0,00"></div>' +
      '<div class="fld"><label>Competência da cobrança</label><input id="sl-comp" type="month" value="' + mesRef(today()) + '"></div></div>' +
      '<div class="fld"><label>Parecer da Vyora</label><textarea id="sl-obs" rows="2" placeholder="Registrado no histórico e visível na auditoria"></textarea></div>';
  } else {
    corpo += ln("Decisão", (STATUS_SOL[s.status] || [])[1]) + ln("Decidida em", s.decidida ? fdt(s.decidida) : "—") +
      ln("Responsável", s.responsavel) + (s.parecer ? '<div class="sm" style="margin-top:10px">' + esc(s.parecer) + "</div>" : "");
  }
  var rod = '<button class="btn" onclick="fecharModal()">Fechar</button>';
  if (s.status === "pendente" || s.status === "analise") {
    rod += '<button class="btn btn-d" onclick="decidir(\'' + id + '\',\'negada\')">Negar</button>' +
      '<button class="btn btn-p btn-g" onclick="decidir(\'' + id + '\',\'aprovada\')">Aprovar e liberar</button>';
  }
  modal("Solicitação de " + esc(t.nome), corpo, rod, true);
}
function decidir(id, decisao) {
  var s = find(DB.solicitacoes, id), t = find(DB.tenants, s.tenant_id);
  var parecer = v("sl-obs"), valor = nv("sl-valor");
  if (decisao === "negada" && !parecer) return toast("Explique o motivo antes de negar.", "err");
  s.status = decisao; s.decidida = new Date().toISOString(); s.responsavel = me().nome; s.parecer = parecer;
  s.historico = s.historico || [];
  s.historico.push({ data: s.decidida, quem: me().nome, o_que: decisao === "aprovada" ? "aprovou" : "negou", obs: parecer });
  if (decisao === "aprovada") {
    var campo = (TIPO_SOL[s.tipo] || {}).campo;
    if (campo) {
      t.licenca.extras = t.licenca.extras || {};
      var antes = t.licenca.extras[campo] || 0;
      t.licenca.extras[campo] = antes + (s.qtd || 1);
      auditar("Limite ampliado", t.nome, tipoSol(s.tipo), t.id, antes, t.licenca.extras[campo]);
    }
    if (s.tipo === "nova_empresa") {
      /* aprovar não cria a empresa: libera a vaga. O cadastro e os valores continuam com você */
      if (vagasRede(t).cheia) {
        var antesL = limiteEmpresas(t);
        t.licenca.limites = t.licenca.limites || {};
        t.licenca.limites.empresas = antesL + 1;
        auditar("Limite da rede ampliado", t.nome, "de " + antesL + " para " + (antesL + 1) + " empresas", t.id, antesL, antesL + 1);
      }
      s.status = "aprovada";
    }
    if (s.tipo === "modulo" && s.modulo) {
      var mods = modulosDaEmpresa(t).slice();
      if (mods.indexOf(s.modulo) < 0) mods.push(s.modulo);
      t.licenca.modulos = mods;
      if (s.modulo === "growth" && !t.growth_desde) t.growth_desde = today();
      auditar("Módulo liberado por solicitação", modNome(s.modulo), t.nome, t.id);
    }
    if (valor > 0) {
      var comp = v("sl-comp") || mesRef(today());
      DB.faturas.push({
        id: uid("f"), tenant_id: t.id, tipo: "servico", competencia: comp,
        descricao: "Ampliação aprovada · " + tipoSol(s.tipo), valor: valor,
        venc: comp + "-" + String(Math.min(28, (t.licenca && t.licenca.dia_venc) || 10)).padStart(2, "0"),
        status: "aberta", pago_em: null, codigo: linhaDigitavel(), criado: today()
      });
      s.status = "aguardando_pagamento";
      auditar("Cobrança adicional gerada", t.nome, tipoSol(s.tipo) + " · " + money(valor), t.id);
    }
  }
  auditar(decisao === "aprovada" ? "Solicitação aprovada" : "Solicitação negada", t.nome, tipoSol(s.tipo) + (parecer ? " · " + parecer : ""), t.id, "pendente", decisao);
  save(); fecharModal();
  if (decisao === "aprovada" && s.tipo === "nova_empresa") {
    toast("Aprovada. Cadastre a empresa e defina os valores dela.", "ok");
    return modalEmpresa(null, t.id);
  }
  toast(decisao === "aprovada" ? "Aprovada. O limite já vale no ambiente do cliente." : "Solicitação negada.", decisao === "aprovada" ? "ok" : "err");
  ir("solicitacoes");
}

    metric("Aguardando pagamento", n0(l.filter(function (t) { return !t.provisionado; }).length), "ambiente ainda não criado", "wr") +
    metric("Concluídas", n0(l.filter(function (t) { return t.situacao === "ativa"; }).length), "empresas em operação", "pos") +

  h += '<div class="kb">' + ETAPAS.map(function (e) {
    var cards = l.filter(function (t) { return (implantacaoDe(t.id) || {}).etapa === e; });

          "<b>" + esc(t.nome) + '</b><div class="sm mut">' + esc(resumoLicenca(t)) +

          '<div class="sm mut" style="margin-top:5px">' + progImplantacao(im) + "% do checklist · " + diasDe(im.inicio) + "</div></div>";
      }).join("") +
      (cards.length ? "" : '<div class="sm mut" style="padding:10px 2px">vazio</div>') + "</div>";
  }).join("") + "</div>";

function prazoMedioImplantacao() {
  var l = empresas().filter(function (t) { return t.situacao === "ativa" && t.implantada; });
  if (!l.length) return "—";
  return Math.max(1, Math.round(sum(l, function (t) { return Math.abs(dDiff(t.criada, t.implantada)); }) / l.length)) + " dias";
}
function soltarCard(ev, etapa) {
  ev.preventDefault();
  var id = ev.dataTransfer.getData("text/plain");
  moverEtapa(id, etapa);
}
function moverEtapa(tid, etapa) {
  var t = find(DB.tenants, tid), im = implantacaoDe(tid);
  if (!im || im.etapa === etapa) return;
  if (!t.provisionado && ETAPAS.indexOf(etapa) > ETAPAS.indexOf("pagamento_confirmado")) {
    toast("O ambiente ainda não foi criado. Confirme o pagamento inicial primeiro.", "err");
    return verEmpresa(tid, "empresa");
  }
  var antes = im.etapa;
  im.etapa = etapa;
  im.historico.push({ etapa: etapa, data: today(), user_id: Sess.user_id });
  if (etapa === "ativa") {
    t.situacao = "ativa"; t.status = "ativo"; t.implantada = t.implantada || today();
    im.checklist.forEach(function (c) { c.ok = true; });
  } else if (SITUACAO[etapa]) t.situacao = etapa;
  auditar("Etapa da implantação alterada", t.nome, "", t.id, ETAPA_LBL[antes] || antes, ETAPA_LBL[etapa] || etapa);
  save(); toast(t.nome + " · " + ETAPA_LBL[etapa], "ok");
  ir(View.pg, View.p);
}
function abrirImplantacao(tid) {
  var t = find(DB.tenants, tid);
  drawer(esc(t.nome), "Implantação · " + esc(ETAPA_LBL[implantacaoDe(tid).etapa]),
    [["checklist", "Checklist"], ["historico", "Histórico"]], "checklist",
    function (a) { return corpoImplantacao(t, a); },
    '<button class="btn btn-p" onclick="verEmpresa(\'' + tid + '\')">Abrir prontuário</button>' +
    (implantacaoDe(tid).etapa !== "ativa" ? '<button class="btn btn-g" onclick="avancarEtapa(\'' + tid + '\')">Avançar etapa</button>' : ""));
}
function avancarEtapa(tid) {
  var im = implantacaoDe(tid), i = ETAPAS.indexOf(im.etapa);
  if (i < ETAPAS.length - 1) { moverEtapa(tid, ETAPAS[i + 1]); fecharDrawer(); }
}
function corpoImplantacao(t, aba) {
  var im = implantacaoDe(t.id);
  if (aba === "historico") {
    return '<div class="box"><div class="box-b">' + srt(im.historico, function (x) { return x.data; }, true).map(function (x) {

function duracao(a, b) {
  var m = Math.round((new Date(b) - new Date(a)) / 6e4);

}

function impersonar(tid) {
  var t = find(DB.tenants, tid), uid2 = v("ip-user"), motivo = v("ip-motivo"), obs = v("ip-obs");
  var s = {
    id: uid("s"), user_id: Sess.user_id, alvo_user_id: uid2, tenant_id: tid, nome: me().nome,
    inicio: new Date().toISOString(), ultima: new Date().toISOString(), ip: SESSAO.ip, dispositivo: SESSAO.dispositivo,
    status: "ativa", origem: "impersonacao", motivo: motivo + (obs ? " · " + obs : "")
  };
  DB.sessoes.push(s);
  Store.set(SKEY, JSON.stringify(marcarSessao({
    tenant_id: tid, user_id: uid2,
    imp: { sess_id: s.id, por: me().nome, motivo: motivo, inicio: s.inicio }
  })));
  IMP = s.id;
  auditar("Entrou como cliente", t.nome, motivo + (obs ? " · " + obs : ""), tid);
  save(); fecharModal();
  barraImpersonacao();

  var abriu = false;
  try { abriu = !!window.open(url, "_blank"); } catch (e) { abriu = false; }
  modal("Acesso liberado em " + esc(t.nome),
    nota("A sessão já está preparada. Abra o <b>sistema da empresa</b> e você entrará direto, sem digitar token nem senha.", "gd") +
    ln("Empresa", t.nome) + ln("Entrando como", (find(DB.users, uid2) || {}).nome) + ln("Motivo", motivo) +
    '<div class="sm mut" style="margin:14px 0 6px">Endereço do sistema</div>' +
    '<a class="btn btn-p btn-lg" style="width:100%;justify-content:center" href="' + esc(url) + '" target="_blank">Abrir o sistema da empresa</a>' +
    (abriu ? '<div class="sm mut" style="margin-top:10px">Se o navegador bloqueou a nova aba, use o botão acima.</div>'
      : '<div class="sm mut" style="margin-top:10px">O navegador bloqueou a abertura automática — clique no botão.</div>') +

    'Os dois arquivos precisam estar na mesma pasta.</div>',
    '<button class="btn" onclick="fecharModal()">Fechar</button>');
}

function leadPorId(id) { return LEADS.lista.filter(function (x) { return x.id === id; })[0]; }
function gravarLead(id, campos, depois) {

function ligarArrasto() {
  var cartoes = document.querySelectorAll(".kd");
  for (var i = 0; i < cartoes.length; i++) {
    cartoes[i].addEventListener("dragstart", function (e) {
      LEADS.arrastando = this.getAttribute("data-id");
      this.classList.add("indo");
      if (e.dataTransfer) e.dataTransfer.effectAllowed = "move";
    });
    cartoes[i].addEventListener("dragend", function () {
      LEADS.arrastando = null; this.classList.remove("indo");
    });
  }
  var colunas = document.querySelectorAll(".kcol");
  for (var c = 0; c < colunas.length; c++) {
    colunas[c].addEventListener("dragover", function (e) { e.preventDefault(); this.classList.add("sobre"); });
    colunas[c].addEventListener("dragleave", function () { this.classList.remove("sobre"); });
    colunas[c].addEventListener("drop", function (e) {
      e.preventDefault(); this.classList.remove("sobre");
      var id = LEADS.arrastando, destino = this.getAttribute("data-col");
      LEADS.arrastando = null;

   ======================================================================= */
var PERFIS_NUVEM = { lista: [], carregando: false, erro: "" };
var PAPEIS_NUVEM = [
  ["vyora", "Equipe Vyora", "Administra a plataforma inteira"],
  ["admin", "Administrador da empresa", "Toda a operação e o financeiro da empresa dele"],
  ["vendedor", "Vendedor · PDV", "Só o comercial: venda, clientes e produtos"],
  ["holding", "Gestor da rede", "Números consolidados do grupo, sem a operação"]
];
function rotuloPapel(k) {
  var p = PAPEIS_NUVEM.filter(function (x) { return x[0] === k; })[0];

function carregarPerfisNuvem() {
  if (!supaConfigurado()) { PERFIS_NUVEM.erro = "O projeto do Supabase ainda não foi configurado."; return pintarAcessos(); }
  if (!supaAutenticado()) {
    /* a sessão pode ter expirado enquanto a tela estava aberta */
    return religarSupabase(function (ok) {
      if (ok) return carregarPerfisNuvem();
      PERFIS_NUVEM.carregando = false;
      PERFIS_NUVEM.erro = "A conexão com o servidor expirou. Entre de novo com a sua conta do Supabase.";
      pintarAcessos();
    });
  }
  PERFIS_NUVEM.carregando = true; PERFIS_NUVEM.erro = "";
  supaPedido("/rest/v1/perfis?select=*&order=criado_em.desc", { method: "GET" })
    .then(function (r) {
      if (r.status === 401 || r.status === 403) { SUPA_TOKEN = null; throw new Error("A conexão com o servidor expirou. Recarregue a página para entrar de novo."); }
      if (r.status === 404) throw new Error("A tabela perfis ainda não existe. Rode o arquivo supabase-identidade.sql no SQL Editor.");
      if (!r.ok) throw new Error("O Supabase respondeu " + r.status + ".");
      return r.json();
    })
    .then(function (j) { PERFIS_NUVEM.lista = j || []; PERFIS_NUVEM.carregando = false; pintarAcessos(); })
    .catch(function (e) { PERFIS_NUVEM.carregando = false; PERFIS_NUVEM.erro = e.message; pintarAcessos(); });

function salvarAcessoNuvem(uid) {
  var err = el("ac-err");
  function bad(m) { err.innerHTML = "<span>" + ICON.alert + "</span><div>" + m + "</div>"; err.classList.remove("hidden"); }
  var nome = v("ac-nome"), tenant = v("ac-tenant"), papel = v("ac-papel");
  if (nome.length < 2) return bad("Informe o nome da pessoa.");
  if (!tenant) return bad("Escolha a empresa.");
  var corpo = { nome: nome, tenant_id: tenant, perfil: papel };
  if (uid) {
    supaPedido("/rest/v1/perfis?user_id=eq." + encodeURIComponent(uid), {
      method: "PATCH", headers: { Prefer: "return=minimal" }, body: JSON.stringify(corpo)
    }).then(function (r) {
      if (!r.ok) return bad("O Supabase recusou a alteração (" + r.status + ").");
      auditar("Acesso na nuvem alterado", nome, tenant + " · " + papel);
      save(); fecharModal(); carregarPerfisNuvem(); toast("Acesso atualizado.", "ok");
    }).catch(function () { bad("Sem resposta do Supabase."); });
    return;
  }
  var id = String(v("ac-uid")).trim(), mail = String(v("ac-mail")).trim();
  if (!/^[0-9a-f-]{36}$/i.test(id)) return bad("Cole o User UID exatamente como aparece no Supabase.");
  if (mail.indexOf("@") < 0) return bad("Informe o e-mail da pessoa.");
  corpo.user_id = id; corpo.email = mail;
  supaPedido("/rest/v1/perfis", {
    method: "POST", headers: { Prefer: "return=minimal" }, body: JSON.stringify(corpo)
  }).then(function (r) {
    if (r.status === 409) return bad("Esta pessoa já está vinculada.");
    if (!r.ok) return bad("O Supabase recusou o cadastro (" + r.status + "). Confira se o UID existe em Authentication › Users.");
    auditar("Acesso na nuvem criado", nome, mail + " · " + tenant + " · " + papel);
    save(); fecharModal(); carregarPerfisNuvem(); toast("Acesso vinculado.", "ok");
  }).catch(function () { bad("Sem resposta do Supabase."); });
}
function alternarAcessoNuvem(uid, ativo) {
  supaPedido("/rest/v1/perfis?user_id=eq." + encodeURIComponent(uid), {

  supaPedido("/rest/v1/backups?select=id,tenant_id,feito_em,itens&order=feito_em.desc&limit=40", { method: "GET" })

function restaurarCopia(id, empresa, quando) {

/* ---------------- o ambiente publicado na liberação ----------------
   O cliente precisa conseguir entrar do computador dele, que nunca
   viu este sistema. Para isso o ambiente tem que existir no servidor
   ANTES do primeiro acesso — e quem tem esses dados na mão, na hora
   de liberar a empresa, é o console. Senha nenhuma vai no pacote. */
var SEGREDOS_AMB = ["senha", "senha_hash", "salt", "senha_em", "provisoria", "tentativas", "bloqueio_ate", "bloqueado_ate", "acesso"];
function semSegredosConsole(u) {
  var c = {};
  for (var k in u) if (u.hasOwnProperty(k) && SEGREDOS_AMB.indexOf(k) < 0) c[k] = u[k];
  return c;
}
function pacoteAmbienteConsole(t) {
  if (!t) return null;
  return {
    tenant: t,
    config: DB.config.filter(function (x) { return x.tenant_id === t.id; })[0] || null,
    users: DB.users.filter(function (u) { return u.tenant_id === t.id; }).map(semSegredosConsole)
  };
}
function publicarAmbienteConsole(t, depois) {
  if (!supaConfigurado() || !supaAutenticado() || !t) return depois && depois(false);
  var p = pacoteAmbienteConsole(t);
  if (!p) return depois && depois(false);
  supaPedido("/rest/v1/ambientes", {
    method: "POST",
    headers: { Prefer: "resolution=merge-duplicates,return=minimal" },
    body: JSON.stringify({ tenant_id: t.id, dados: p })
  }).then(function (r) { if (depois) depois(r.ok); })
    .catch(function () { if (depois) depois(false); });
}
function publicarAmbientesTodos() {
  if (!supaConfigurado() || !supaAutenticado()) return toast("Conecte a sua conta do Supabase nesta tela primeiro.", "err");
  var lista = DB.tenants.filter(function (t) { return t.id !== "vyora" && t.provisionado; });
  if (!lista.length) return toast("Nenhuma empresa liberada ainda.", "err");
  var corpo = lista.map(function (t) { return { tenant_id: t.id, dados: pacoteAmbienteConsole(t) }; });
  supaPedido("/rest/v1/ambientes", {
    method: "POST",
    headers: { Prefer: "resolution=merge-duplicates,return=minimal" },
    body: JSON.stringify(corpo)
  }).then(function (r) {
    if (!r.ok) return toast("O Supabase recusou o envio (" + r.status + ").", "err");
    auditar("Ambientes publicados", lista.length + " empresa(s)", "");
    save(); toast(lista.length + " ambiente(s) prontos para o primeiro acesso.", "ok");
  }).catch(function () { toast("Sem resposta do Supabase.", "err"); });
}

/* ---------------- o mapa da rede no servidor ----------------
   Quem é matriz de quem não pode ser decidido pelo navegador do
   cliente. O console publica esse mapa; é ele que o servidor usa
   para somar os números que o gestor da rede recebe. */
/* o administrador da empresa: é o único e-mail que consegue refazer
   o próprio vínculo pelo token quando não há ambiente publicado */
function adminDaEmpresa(t) {
  var l = DB.users.filter(function (u) {
    return u.tenant_id === t.id && u.status !== "inativo" &&
      (u.perfil === "admin" || u.perfil === "holding");
  });
  return l[0] ? String(l[0].email || "").toLowerCase() : null;
}
function linhaEmpresaNuvem(t) {
  return {
    tenant_id: t.id, nome: t.nome, matriz_id: t.matriz_id || null,
    ativo: t.status === "ativo",
    token: t.token || null, email_admin: adminDaEmpresa(t)
  };
}
function registrarEmpresaNuvem(t, depois) {
  if (!supaConfigurado() || !supaAutenticado() || !t) return depois && depois(false);
  supaPedido("/rest/v1/empresas", {
    method: "POST",
    headers: { Prefer: "resolution=merge-duplicates,return=minimal" },
    body: JSON.stringify(linhaEmpresaNuvem(t))
  }).then(function (r) { if (depois) depois(r.ok); })
    .catch(function () { if (depois) depois(false); });
}
function publicarMapaDaRede() {
  if (!supaConfigurado() || !supaAutenticado()) return toast("Conecte a sua conta do Supabase nesta tela primeiro.", "err");
  var lista = DB.tenants.filter(function (t) { return t.id !== "vyora"; }).map(linhaEmpresaNuvem);
  if (!lista.length) return toast("Nenhuma empresa cadastrada ainda.", "err");

    method: "POST",

    body: JSON.stringify(lista)
  }).then(function (r) {

    auditar("Mapa da rede publicado", lista.length + " empresa(s)", "");

  }).catch(function () { toast("Sem resposta do Supabase.", "err"); });
}

/* ---------------- publicar deixou de ser tarefa de alguém ----------------
   Publicar o mapa e os ambientes nunca foi uma decisão: é só o que
   precisa estar lá para o cliente conseguir entrar. Então acontece
   sozinho, sempre que o console está conectado e alguma coisa mudou.
   Os botões continuam existindo para forçar na hora — mas ninguém
   precisa lembrar deles. */
var K_MAPA_ENVIADO = "vyora_mapa_enviado";
function retratoDaRede() {
  return JSON.stringify(DB.tenants.filter(function (t) { return t.id !== "vyora"; })
    .map(function (t) {
      var l = linhaEmpresaNuvem(t);
      return [l.tenant_id, l.nome, l.matriz_id, l.ativo, l.token, l.email_admin,
        DB.users.filter(function (u) { return u.tenant_id === t.id; })
          .map(function (u) { return u.id + ":" + u.email + ":" + u.perfil + ":" + u.status; }).join(",")].join("|");
    }).sort());
}
function publicarTudoSozinho() {
  if (!supaConfigurado() || !supaAutenticado()) return;
  var agora = retratoDaRede();
  if (Store.get(K_MAPA_ENVIADO) === agora) return;
  var empresasLinhas = DB.tenants.filter(function (t) { return t.id !== "vyora"; }).map(linhaEmpresaNuvem);
  if (!empresasLinhas.length) return;
  supaPedido("/rest/v1/empresas", {
    method: "POST",
    headers: { Prefer: "resolution=merge-duplicates,return=minimal" },
    body: JSON.stringify(empresasLinhas)
  }).then(function (r) {
    if (!r.ok) return;
    var amb = DB.tenants.filter(function (t) { return t.id !== "vyora" && t.provisionado; })
      .map(function (t) { return { tenant_id: t.id, dados: pacoteAmbienteConsole(t) }; });
    if (!amb.length) { try { Store.set(K_MAPA_ENVIADO, agora); } catch (e) {} return; }
    supaPedido("/rest/v1/ambientes", {
      method: "POST",
      headers: { Prefer: "resolution=merge-duplicates,return=minimal" },
      body: JSON.stringify(amb)
    }).then(function (r2) {
      if (r2.ok) { try { Store.set(K_MAPA_ENVIADO, agora); } catch (e) {} }
    }).catch(function () {});
  }).catch(function () {});
}

/* ---------------- acesso na nuvem criado sozinho ----------------
   Ao provisionar a empresa, a conta de acesso do administrador dela
   nasce no Supabase junto com o ambiente. Você não abre o painel. */
/* pedir ao servidor que troque a senha de alguém. A permissão é
   conferida lá dentro: a Vyora alcança qualquer pessoa, o admin de
   uma empresa só alcança a equipe dele. */
/* o "de onde" vai junto: se a conta existir no Auth mas tiver perdido
   o vínculo com a empresa, o servidor refaz o vínculo na mesma chamada
   em vez de responder "não encontramos esse acesso" e parar tudo */
function redefinirSenhaNuvemConsole(email, senha, depois, empresa, papel) {
  var c = supaCfg();
  if (typeof fetch !== "function" || !c.url || !supaAutenticado()) return depois && depois(false, "console desconectado do servidor");
  var pessoa = DB.users.filter(function (u) { return String(u.email || "").toLowerCase() === String(email).toLowerCase(); })[0];
  var alvo = empresa || (pessoa && pessoa.tenant_id) || null;
  var corpo = { email: String(email).toLowerCase(), senha: senha };
  if (alvo) {
    var p = papel || (pessoa && pessoa.perfil) || "vendedor";
    corpo.tenant_id = alvo;
    corpo.perfil = p === "holding" ? "holding" : p === "admin" ? "admin" : "vendedor";
    corpo.nome = (pessoa && pessoa.nome) || email;
  }
  fetch(c.url + "/functions/v1/redefinir-senha", {
    method: "POST",
    headers: { apikey: c.key, Authorization: "Bearer " + SUPA_TOKEN, "Content-Type": "application/json" },
    body: JSON.stringify(corpo)
  }).then(function (r) { return r.json().then(function (j) { return { ok: r.ok, j: j }; }); })
    .then(function (x) { if (depois) depois(!!(x.ok && x.j && x.j.ok), x.j && x.j.erro); })
    .catch(function () { if (depois) depois(false, "sem resposta do servidor"); });
}
var senhaNaoTrocou = "";
function criarContaNuvemConsole(email, senha, tenantId, papel, nome, depois) {
  var c = supaCfg();
  function fim(ok, motivo) { if (depois) depois(ok, motivo); if (!ok && motivo) toast(motivo, "err"); }
  if (typeof fetch !== "function" || !c.url || !c.key) return fim(false, "O projeto do Supabase não está configurado — o acesso na nuvem não foi criado.");
  if (!supaAutenticado()) return fim(false, "O console não está conectado ao servidor — o acesso na nuvem não foi criado. Abra Acessos na nuvem e entre.");
  if (!email || !senha) return fim(false, "Faltou e-mail ou senha para criar o acesso na nuvem.");
  fetch(c.url + "/auth/v1/signup", {
    method: "POST", headers: { apikey: c.key, "Content-Type": "application/json" },
    body: JSON.stringify({ email: String(email).trim().toLowerCase(), password: senha })
  }).then(function (r) { return r.json().then(function (j) { return { ok: r.ok, j: j }; }); })
    .then(function (x) {
      var uid = x.j && (x.j.id || (x.j.user && x.j.user.id));
      if (!uid) {
        var m = (x.j && (x.j.msg || x.j.error_description || x.j.message)) || "o servidor recusou";
        return fim(false, "Não foi possível criar o acesso de " + email + " na nuvem: " + m);
      }
      /* o servidor responde igual para conta nova e conta que já existe —
         a diferença é a lista de identidades vazia. Quando já existe, criar
         não muda a senha: quem muda é a função do servidor. */
      var ident = (x.j.user && x.j.user.identities) || x.j.identities;
      if (Array.isArray(ident) && ident.length === 0) {
        /* conta que já existe: o id devolvido aqui não é confiável, então
           não gravamos perfil com ele. Quem troca a senha E refaz o
           vínculo, com o id de verdade, é a função do servidor. */
        return redefinirSenhaNuvemConsole(email, senha, function (deu, motivo) {
          if (deu) {
            auditar("Acesso na nuvem religado", email, tenantId + " · " + papel);
            return fim(true);
          }
          senhaNaoTrocou = email;
          fim(false, "O acesso de " + email + " já existia e não consegui repará-lo" +
            (motivo ? " (" + motivo + ")" : "") + ".");
        }, tenantId, papel);
      }
      supaPedido("/rest/v1/perfis", {
        method: "POST",
        headers: { Prefer: "resolution=merge-duplicates,return=minimal" },
        body: JSON.stringify({
          user_id: uid, email: String(email).toLowerCase(), nome: nome || email,
          tenant_id: tenantId, perfil: papel, ativo: true
        })
      }).then(function (r) {
        if (!r.ok) return fim(false, "A conta de " + email + " foi criada, mas não ficou vinculada à empresa (" + r.status + ").");
        auditar("Acesso na nuvem criado", email, tenantId + " · " + papel);
        fim(true);
      }).catch(function () { fim(false, "Sem resposta do servidor ao vincular o acesso de " + email + "."); });
    }).catch(function () { fim(false, "Sem resposta do servidor ao criar o acesso de " + email + "."); });
}
/* conserta o que ficou pelo caminho: empresa liberada sem acesso na
   nuvem, porque o console estava desconectado naquele momento */
function criarAcessosQueFaltam() {
  if (!supaConfigurado() || !supaAutenticado()) return toast("Conecte a sua conta do Supabase nesta tela primeiro.", "err");
  var vinculados = {};
  (PERFIS_NUVEM.lista || []).forEach(function (p) { vinculados[String(p.email || "").toLowerCase()] = true; });
  var faltando = [];
  DB.tenants.filter(function (t) { return t.id !== "vyora" && t.provisionado; }).forEach(function (t) {
    DB.users.filter(function (u) { return u.tenant_id === t.id; }).forEach(function (u) {
      var senha = u.provisoria || t.senha_provisoria;
      if (!vinculados[String(u.email || "").toLowerCase()] && senha) faltando.push({ u: u, t: t, senha: senha });
    });
  });
  if (!faltando.length) return toast("Todos os acessos já existem na nuvem.", "ok");
  var feitos = 0, i = 0;
  (function proximo() {
    if (i >= faltando.length) {
      carregarPerfisNuvem();
      return toast(feitos + " de " + faltando.length + " acesso(s) criados.", feitos ? "ok" : "err");
    }
    var x = faltando[i++];
    criarContaNuvemConsole(x.u.email, x.senha, x.t.id, x.u.perfil === "holding" ? "holding" : x.u.perfil === "admin" ? "admin" : "vendedor",
      x.u.nome, function (ok) { if (ok) feitos++; proximo(); });
  })();
}

    box("Cópias de segurança das empresas", '<div class="box-b">' +
      '<div class="sm mut" style="margin-bottom:12px">O servidor guarda uma cópia por dia de cada empresa. ' +
      "O cliente vê que ela existe, mas não consegue abrir nem apagar — restaurar é sempre uma decisão da Vyora.</div>" +
      '<div id="cp-lista"><div class="sm mut">Consultando o Supabase…</div></div>' +
      '<button class="btn" style="margin-top:14px" onclick="carregarCopiasVyora()">Atualizar</button></div>');
  h += '<div style="height:14px"></div><div id="ac-lista"><div class="box"><div class="box-b sm mut">Consultando o Supabase…</div></div></div>';
  return h;
}

(function () {
  if (!load()) seedConsole();
  if (!Array.isArray(DB.removidos)) DB.removidos = [];
  /* o console também divide o banco com as outras abas: sem escutar as
     mudanças, a aba antiga apaga o que a nova cadastrou */
  if (typeof window.addEventListener === "function") {
    window.addEventListener("storage", function (e) {
      if (!e || e.key !== KEY) return;
      try { if (load() && Sess && View.pg) ir(View.pg, View.p); } catch (err) {}
    });
  }
  migrar();
  migrarSenhas();
  var trocados = renovarTokensVencidos();
  if (trocados.length) trocados.forEach(function (t) {
    DB.logs.push({
      id: uid("lg"), origem: "console", user_id: null, nome: "sistema",
      acao: "Token renovado automaticamente", alvo: t.nome, detalhe: "validade trimestral",
      tenant_id: t.id, data: new Date().toISOString(), ip: "sistema", dispositivo: "rotina"
    });
  });
  atualizarSituacoes();
  document.addEventListener("click", function (e) {
    if (!e.target.closest(".bar-r")) { var p = el("me-pop"); if (p) p.classList.add("hidden"); }
  });
  var imp = DB.sessoes.filter(function (s) { return s.origem === "impersonacao" && s.status === "ativa"; })[0];
  if (imp) IMP = imp.id;
  var faltando = MENU.filter(function (m) { return typeof window["pg_" + m.k] !== "function"; });
  if (faltando.length) {
    document.body.innerHTML = '<div style="max-width:560px;margin:14vh auto;font-family:system-ui;padding:26px;' +
      'border:1px solid #d9c48a;background:#fdf7e6;border-radius:16px;line-height:1.6">' +
      "<h2 style='margin:0 0 10px;font-size:19px'>Arquivo incompleto</h2>" +
      "<p style='margin:0 0 10px;color:#4a4a4a'>Faltam módulos neste console: <b>" +
      faltando.map(function (m) { return m.n; }).join(", ") + "</b>.</p>" +
      "<p style='margin:0;color:#4a4a4a'>Baixe o arquivo de novo e abra com <b>Ctrl+F5</b>. " +
      "Nenhum dado foi perdido — o banco continua salvo neste navegador.</p></div>";
    return;
  }
  if (restaurar()) { iniciar(); barraImpersonacao(); }
  else { renderLogin(); }
  setInterval(function () {
    if (!Sess) return;
    atualizarSituacoes(); tocarSessao();
    /* e o que precisa estar no servidor vai para o servidor. Se nada
       mudou, isto não faz pedido nenhum — compara e desiste. */
    publicarTudoSozinho();
  }, 60000);
})();

</script>
